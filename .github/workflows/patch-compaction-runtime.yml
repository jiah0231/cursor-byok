name: Patch and verify runtime compaction

on:
  push:
    branches: [fix/compaction-during-resume-timeout]
    paths: [.github/workflows/patch-compaction-runtime.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Patch runtime compaction
        shell: python
        run: |
          from pathlib import Path

          p = Path('server/src/run/engine.rs')
          s = p.read_text()

          old = 'use std::collections::HashSet;\nuse std::sync::Arc;'
          new = 'use std::collections::HashSet;\nuse std::{sync::Arc, time::Duration};'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;\nconst COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;'
          new = 'const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;\nconst COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;\nconst AUTO_COMPACTION_TIMEOUT: Duration = Duration::from_secs(45);'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              *action == RunAction::Start && last_auto_compaction_revision != Some(revision)
          }'''
          new = '''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              !matches!(action, RunAction::Compact) && last_auto_compaction_revision != Some(revision)
          }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    if prepared.action != RunAction::Start || messages.len() <= prepared.initial_messages.len() {
                  return false;
              }'''
          new = '''    if prepared.action == RunAction::Compact || messages.len() <= prepared.initial_messages.len() {
                  return false;
              }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        let mut pending_insertions = Vec::new();
                  let mut interrupted_message = None;
                  let cycle = {
                      let cycle = consume_model_cycle(
                          self.provider.stream(invocation, cycle_cancellation.clone()),
                          &silent_events,
                          &cycle_cancellation,
                      );
                      tokio::pin!(cycle);
                      loop {
                          tokio::select! {
                              biased;
                              command = client.commands.recv() => match command {
                                  Some(ClientCommand::InsertMessages(insertion)) => {
                                      pending_insertions.push(insertion);
                                  }
                                  Some(ClientCommand::InterruptWithMessage(message)) => {
                                      cycle_cancellation.cancel();
                                      interrupted_message = Some(message);
                                      break cycle.await;
                                  }
                                  Some(ClientCommand::RuntimeEvent(event)) => {
                                      cycle_cancellation.cancel();
                                      interrupted_message = Some(event.into_message());
                                      break cycle.await;
                                  }
                                  Some(ClientCommand::Cancel) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Cancelled);
                                  }
                                  Some(ClientCommand::ClientClosed { error }) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Failed(RunFailure::Client(error)));
                                  }
                                  Some(ClientCommand::ToolResult(_)) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Failed(RunFailure::Protocol(
                                          "received a tool result while automatic compaction was running".into(),
                                      )));
                                  }
                                  None => {
                                      cycle_cancellation.cancel();
                                      return Err(client_failure());
                                  }
                              },
                              result = &mut cycle => break result,
                          }
                      }
                  };
                  drop(silent_events);
                  let _ = drain.await;
                  let (summary, compaction_usage) = match (interrupted_message.is_some(), cycle) {
                      (true, Ok(cycle)) => (fallback_summary(&compactable), cycle.usage),
                      (true, Err(failure)) => (fallback_summary(&compactable), failure.usage),
                      (false, Ok(cycle)) if cycle.calls.is_empty() && !cycle.text.trim().is_empty() => {
                          (cycle.text.trim().to_string(), cycle.usage)
                      }
                      (false, Ok(cycle)) => {
                          tracing::warn!("automatic compaction returned no usable summary; using fallback");
                          (fallback_summary(&compactable), cycle.usage)
                      }
                      (false, Err(failure)) => {
                          tracing::warn!(error = ?failure.failure, "automatic compaction model failed; using fallback");
                          (fallback_summary(&compactable), failure.usage)
                      }
                  };'''
          new = '''        let mut pending_insertions = Vec::new();
                  let mut interrupted_message = None;
                  let mut compaction_timed_out = false;
                  let cycle = {
                      let cycle = consume_model_cycle(
                          self.provider.stream(invocation, cycle_cancellation.clone()),
                          &silent_events,
                          &cycle_cancellation,
                      );
                      tokio::pin!(cycle);
                      let timeout = tokio::time::sleep(AUTO_COMPACTION_TIMEOUT);
                      tokio::pin!(timeout);
                      loop {
                          tokio::select! {
                              biased;
                              command = client.commands.recv() => match command {
                                  Some(ClientCommand::InsertMessages(insertion)) => {
                                      pending_insertions.push(insertion);
                                  }
                                  Some(ClientCommand::InterruptWithMessage(message)) => {
                                      cycle_cancellation.cancel();
                                      interrupted_message = Some(message);
                                      break Some(cycle.await);
                                  }
                                  Some(ClientCommand::RuntimeEvent(event)) => {
                                      cycle_cancellation.cancel();
                                      interrupted_message = Some(event.into_message());
                                      break Some(cycle.await);
                                  }
                                  Some(ClientCommand::Cancel) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Cancelled);
                                  }
                                  Some(ClientCommand::ClientClosed { error }) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Failed(RunFailure::Client(error)));
                                  }
                                  Some(ClientCommand::ToolResult(_)) => {
                                      cycle_cancellation.cancel();
                                      return Err(RunOutcome::Failed(RunFailure::Protocol(
                                          "received a tool result while automatic compaction was running".into(),
                                      )));
                                  }
                                  None => {
                                      cycle_cancellation.cancel();
                                      return Err(client_failure());
                                  }
                              },
                              result = &mut cycle => break Some(result),
                              _ = &mut timeout => {
                                  compaction_timed_out = true;
                                  cycle_cancellation.cancel();
                                  break None;
                              },
                          }
                      }
                  };
                  drop(silent_events);
                  let _ = drain.await;
                  let (summary, compaction_usage) = match (interrupted_message.is_some(), compaction_timed_out, cycle) {
                      (false, true, None) => {
                          tracing::warn!(timeout_seconds = AUTO_COMPACTION_TIMEOUT.as_secs(), "automatic compaction timed out; using fallback");
                          (fallback_summary(&compactable), None)
                      }
                      (true, _, Some(Ok(cycle))) => (fallback_summary(&compactable), cycle.usage),
                      (true, _, Some(Err(failure))) => (fallback_summary(&compactable), failure.usage),
                      (false, false, Some(Ok(cycle))) if cycle.calls.is_empty() && !cycle.text.trim().is_empty() => {
                          (cycle.text.trim().to_string(), cycle.usage)
                      }
                      (false, false, Some(Ok(cycle))) => {
                          tracing::warn!("automatic compaction returned no usable summary; using fallback");
                          (fallback_summary(&compactable), cycle.usage)
                      }
                      (false, false, Some(Err(failure))) => {
                          tracing::warn!(error = ?failure.failure, "automatic compaction model failed; using fallback");
                          (fallback_summary(&compactable), failure.usage)
                      }
                      (_, _, None) => {
                          tracing::warn!("automatic compaction ended without a model result; using fallback");
                          (fallback_summary(&compactable), None)
                      }
                  };'''
          assert old in s
          s = s.replace(old, new, 1)

          # Strengthen unit coverage: Resume must be eligible, Compact must not.
          old = '''        assert!(auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(3),
                      Some(RevisionId(2)),
                  ));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Compact,
                      RevisionId(3),
                      None,
                  ));'''
          new = '''        assert!(auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(3),
                      Some(RevisionId(2)),
                  ));
                  assert!(auto_compaction_allowed(
                      &RunAction::Resume { pending_tool_round: None },
                      RevisionId(3),
                      Some(RevisionId(2)),
                  ));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Compact,
                      RevisionId(3),
                      None,
                  ));'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        assert!(auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(11),
                      Some(RevisionId(10))
                  ));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Compact,
                      RevisionId(11),
                      None
                  ));'''
          new = '''        assert!(auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(11),
                      Some(RevisionId(10))
                  ));
                  assert!(auto_compaction_allowed(
                      &RunAction::Resume { pending_tool_round: None },
                      RevisionId(11),
                      Some(RevisionId(10))
                  ));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Compact,
                      RevisionId(11),
                      None
                  ));'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Add Resume compaction regression test
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/tests/compaction_recovery.rs')
          s = p.read_text()
          marker = 'async fn record_threshold_anchor('
          assert marker in s
          test = r'''
          #[tokio::test]
          async fn resume_action_auto_compacts_before_the_next_model_call() {
              let (_directory, store) = fixtures::temp_store().await;
              let model = store
                  .create_model(&ModelConfigInput {
                      sort_order: 0,
                      display_name: "Resume Threshold Model".into(),
                      model_type: ModelType::OpenAi,
                      base_url: "https://example.com/v1/chat/completions".into(),
                      use_full_url: true,
                      api_key: "test-key".into(),
                      tooltip_data: "Resume Threshold Model".into(),
                      model_id: "resume-threshold-model".into(),
                      reasoning_effort: None,
                      openai_endpoint: OPENAI_CHAT_ENDPOINT.into(),
                      openai_extra_params_enabled: false,
                      openai_extra_params: serde_json::json!({}),
                      custom_headers_enabled: false,
                      custom_headers: serde_json::json!({}),
                      anthropic_extra_params_enabled: false,
                      anthropic_extra_params: serde_json::json!({}),
                      context_window_tokens: Some(150_000),
                      max_completion_tokens: Some(16_000),
                      anthropic_max_tokens: None,
                      anthropic_thinking_effort: None,
                      thinking_budget_tokens: None,
                  })
                  .await
                  .unwrap();
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("initial long-work answer", 132_000, 100));
              provider.push(text_response("resume compaction summary", 132_100, 20));
              provider.push(text_response("continued after resume compaction", 2_000, 20));

              let assets = PromptAssets::load(
                  std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                      .join("prompt/cursor")
                      .as_path(),
              )
              .unwrap();
              let registry = CursorSessionRegistry::new(
                  store.clone(),
                  Arc::new(provider.clone()),
                  PromptCompiler::new(assets),
                  Default::default(),
              );

              let first = run(
                  &registry,
                  "resume-threshold-first",
                  user_request(
                      "resume-threshold-conversation",
                      "resume-threshold-user",
                      "keep working for a long time",
                      &model.model_hash,
                      None,
                  ),
              )
              .await;
              assert!(first.end_error.is_none());
              let first_state = first.checkpoints.last().unwrap().clone();
              let first_request = provider.requests().into_iter().next().unwrap();

              // Record a real-looking high input anchor so the following Resume is already over threshold.
              let call_id = "resume-threshold-anchor";
              let provider_type = model.provider_type();
              store
                  .start_llm_call(&NewLlmCall {
                      call_id: call_id.into(),
                      run_id: "resume-anchor-run".into(),
                      conversation_id: "resume-threshold-conversation".into(),
                      provider_call_index: 0,
                      model_hash: model.model_hash.clone(),
                      provider_type,
                      provider_url: model.base_url.clone(),
                      request_type: provider_type,
                      request_url: model.request_url().unwrap(),
                      model_id: model.model_id.clone(),
                      display_name: model.display_name.clone(),
                      reasoning_effort: None,
                      fast: false,
                      message_count: 0,
                      tool_count: first_request.prompt.tools.len(),
                      detailed: false,
                  })
                  .await
                  .unwrap();
              store
                  .record_llm_usage(
                      call_id,
                      Usage {
                          input_tokens: Some(132_000),
                          output_tokens: Some(100),
                          total_tokens: Some(132_100),
                          ..Default::default()
                      },
                  )
                  .await
                  .unwrap();
              store
                  .finish_llm_call(call_id, "completed", Some("stop"), 1, None, None)
                  .await
                  .unwrap();

              let resumed = run(
                  &registry,
                  "resume-threshold-resume",
                  resume_request(
                      "resume-threshold-conversation",
                      &model.model_hash,
                      first_state,
                  ),
              )
              .await;

              assert!(resumed.end_error.is_none());
              assert_eq!(resumed.summary_started, 1, "Resume should auto-compact without waiting for a new user message");
              assert_eq!(resumed.summary_completed, 1);
              let requests = provider.requests();
              assert_eq!(requests.len(), 3);
              assert!(requests[1].prompt.tools.is_empty(), "second provider call must be the compaction call");
              assert!(history_text(&requests[2].history).contains("resume compaction summary"));
          }

          '''
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Targeted compaction recovery tests
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture
      - name: Engine compaction unit tests
        run: cargo test -p cursor-server run::engine::tests -- --nocapture
      - name: Existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture
      - name: Full cursor-server suite
        run: cargo test -p cursor-server --all-targets
      - name: Diff check
        run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/run/engine.rs server/tests/compaction_recovery.rs
          git commit -m "fix: compact during resume and bound summary latency"
          git push origin HEAD:fix/compaction-during-resume-timeout
