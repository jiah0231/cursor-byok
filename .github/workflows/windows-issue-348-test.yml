name: Build Windows issue 348 test

on:
  push:
    branches:
      - fix/official-model-options-observability

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Apply upstream compile-only lifecycle import workaround
        shell: pwsh
        run: |
          $path = 'server/src/cursor/actor.rs'
          $text = Get-Content $path -Raw
          $old = 'use super::{inbox::OrderedInbox, CursorCommand, CursorSessionHandle};'
          $new = 'use super::{inbox::OrderedInbox, lifecycle, CursorCommand, CursorSessionHandle};'
          if (-not $text.Contains($old)) { throw 'actor.rs lifecycle import anchor not found' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -NoNewline

      - name: Run issue 348 regression tests
        run: |
          cargo test -p cursor-server captures_requested_model_options_for_observability
          cargo test -p cursor-server cursor_trace_links_detailed_artifacts_to_the_logical_run

      - name: Build NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-windows/
          Copy-Item target/release/cursor-byok-desktop.exe dist-windows/cursor-byok-issue-348-portable.exe
          Get-ChildItem dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-issue-348-windows-x86_64
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary workflow from branch
        if: always()
        shell: pwsh
        run: |
          git restore server/src/cursor/actor.rs
          git rm .github/workflows/windows-issue-348-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary Windows test workflow'
          git push origin HEAD:fix/official-model-options-observability
