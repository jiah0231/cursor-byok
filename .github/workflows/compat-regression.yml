name: Removed tool compatibility regression

on:
  push:
    branches:
      - fix/resume-removed-tools
    paths:
      - "server/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run cursor-server tests
        run: cargo test -p cursor-server --all-targets
