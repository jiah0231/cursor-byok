name: Verify upstream AwaitShell baseline

on:
  push:
    branches:
      - fix/compaction-during-resume-timeout
    paths:
      - .github/workflows/verify-upstream-baseline-awaitshell.yml

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check pristine upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/leookun/cursor-byok.git
          git fetch upstream main
          git checkout --detach upstream/main
          cargo test -p cursor-server cursor::tools::dispatch::tests::retired_await_shell_does_not_become_a_protocol_error -- --nocapture
