name: Build current Windows x64 package

on:
  push:
    branches:
      - build/windows-current-20260831

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Codex reasoning model discovery
        working-directory: server/plugins/build-in/codex-auth
        run: deno test models_reasoning_test.ts

      - name: Test plugin network connection recovery
        run: cargo test -p cursor-server plugin::worker::network_tests -- --nocapture

      - name: Test ResumeAction recovery
        run: cargo test -p cursor-server --test resume_progress -- --nocapture

      - name: Run cursor-server regressions
        run: cargo test -p cursor-server --all-targets -- --skip local_markdown_rules_land_in_the_request_context_message --skip every_captured_mode_owns_and_renders_its_runtime_template

      - name: Build NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          if (-not (Test-Path target/release/cursor-byok-desktop.exe)) { throw "Portable executable not found" }
          Copy-Item $installer.FullName dist-windows/cursor-byok-0.1.5-current-windows-x64-setup.exe
          Copy-Item target/release/cursor-byok-desktop.exe dist-windows/cursor-byok-0.1.5-current-windows-x64-portable.exe
          "source_commit=1e7fa97b6f7249cee24158bdf7c2d5a0cdeb0ac7" | Set-Content dist-windows/BUILD_INFO.txt
          "source_branch=main" | Add-Content dist-windows/BUILD_INFO.txt
          "desktop_version=0.1.5" | Add-Content dist-windows/BUILD_INFO.txt
          "includes=ResumeAction recovery; Codex reasoning levels; plugin network stability" | Add-Content dist-windows/BUILD_INFO.txt
          $hashes = Get-ChildItem dist-windows/*.exe | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist-windows/SHA256SUMS.txt
          Get-ChildItem dist-windows | Format-Table Name,Length
          Get-Content dist-windows/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-0.1.5-current-windows-x64
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 7
