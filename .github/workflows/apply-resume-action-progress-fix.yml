name: Apply ResumeAction progress fix

on:
  push:
    branches:
      - fix/resume-action-progress

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply fix and regression tests
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          path = "server/src/cursor/request/context.rs"
          old = (
              "            pb::conversation_action::Action::ExecutePlanAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            _ => None,\n"
          )
          new = (
              "            pb::conversation_action::Action::ExecutePlanAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            pb::conversation_action::Action::ResumeAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            _ => None,\n"
          )
          replace_once(path, old, new)

          old = (
