          old = (
              "    #[test]\n"
              "    fn request_context_is_only_projected_when_its_content_changes() {\n"
          )
          new = dedent(r'''
              #[test]
              fn resume_without_pending_tools_emits_a_hidden_continuation_prompt() {
                  let messages = compile_resume_messages(
                      "resume-request",
