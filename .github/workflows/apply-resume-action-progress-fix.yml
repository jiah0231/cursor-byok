          )
          old = (
              "    #[test]\n"
              "    fn restored_system_root_is_structural_not_bound_to_the_next_model() {\n"
          )
          new = dedent(r'''
              #[test]
              fn explicit_resume_action_is_detected() {
                  let request = pb::AgentRunRequest {
                      action: Some(pb::ConversationAction {
                          action: Some(pb::conversation_action::Action::ResumeAction(
                              pb::ResumeAction::default(),
                          )),
                          ..Default::default()
                      }),
                      ..Default::default()
                  };

                  assert!(is_explicit_resume(&request));
                  let projection = action(&request).unwrap();
                  assert!(!projection.starts_turn);
                  assert!(!projection.compacting);
