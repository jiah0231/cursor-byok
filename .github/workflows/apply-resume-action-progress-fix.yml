name: Apply ResumeAction progress fix

on:
  push:
    branches:
      - fix/resume-action-progress

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply fix and regression tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          # ResumeAction carries its own RequestContext. Consume it just like
          # UserMessageAction and ExecutePlanAction instead of dropping it.
          replace_once(
              "server/src/cursor/request/context.rs",
              '''            pb::conversation_action::Action::ExecutePlanAction(action) => {
                  action.request_context.as_ref()
              }
              _ => None,
          ''',
              '''            pb::conversation_action::Action::ExecutePlanAction(action) => {
                  action.request_context.as_ref()
              }
              pb::conversation_action::Action::ResumeAction(action) => {
                  action.request_context.as_ref()
              }
              _ => None,
          ''',
          )

          replace_once(
              "server/src/cursor/request/context.rs",
              '''    #[test]
              fn dynamic_mcp_normalizes_extension_identifier_for_model_tool_names() {
          ''',
              '''    #[test]
              fn request_context_reads_resume_action_context() {
                  let expected = pb::RequestContext {
                      admin_command_denylist: vec!["blocked-on-resume".into()],
                      ..Default::default()
                  };
                  let request = pb::AgentRunRequest {
                      action: Some(pb::ConversationAction {
                          action: Some(pb::conversation_action::Action::ResumeAction(
                              pb::ResumeAction {
                                  request_context: Some(expected.clone()),
                                  ..Default::default()
                              },
                          )),
                          ..Default::default()
                      }),
                      ..Default::default()
                  };

                  assert_eq!(request_context(&request), Some(&expected));
              }

              #[test]
              fn dynamic_mcp_normalizes_extension_identifier_for_model_tool_names() {
          ''',
          )

          # Give an explicit ResumeAction a model-visible continuation input.
          # Without it, a resume with no pending tool result calls the provider
          # with the same history ending in an assistant message, which can
          # repeatedly produce no progress in Cursor's agent loop.
          replace_once(
              "server/src/cursor/request/runtime.rs",
              '''use super::{context, images};

          pub(crate) async fn compile_injection(
          ''',
              '''use super::{context, images};

          const RESUME_PROMPT: &str = "<resume>\\nContinue the unfinished task from the current conversation state. Use the latest workspace context, make concrete progress toward the user's request, and do not repeat work that is already complete.\\n</resume>";

          pub(crate) async fn compile_injection(
          ''',
          )

          replace_once(
              "server/src/cursor/request/runtime.rs",
              '''fn should_project_request_context(
          ''',
              '''pub(super) fn compile_resume_messages(
              request_id: &str,
              request_context: &pb::RequestContext,
              history: &[CanonicalMessage],
              has_pending_tool_round: bool,
          ) -> Result<Vec<CanonicalMessage>> {
              let event_id = format!("resume:{request_id}");
              let mut messages = compile_request_context(&event_id, request_context, history)?
                  .into_iter()
                  .collect::<Vec<_>>();
              if !has_pending_tool_round {
                  messages.push(CanonicalMessage::text(
                      format!("resume-prompt:{request_id}"),
                      Role::User,
                      Origin::Prompt,
                      RESUME_PROMPT,
                  ));
              }
              Ok(messages)
          }

          fn should_project_request_context(
          ''',
          )

          replace_once(
              "server/src/cursor/request/runtime.rs",
              '''    #[test]
              fn request_context_is_only_projected_when_its_content_changes() {
          ''',
              '''    #[test]
              fn resume_without_pending_tools_emits_a_hidden_continuation_prompt() {
                  let messages = compile_resume_messages(
                      "resume-request",
                      &pb::RequestContext::default(),
                      &[],
                      false,
                  )
                  .unwrap();

                  let [message] = messages.as_slice() else {
                      panic!("expected one continuation message")
                  };
                  assert_eq!(message.message_id, "resume-prompt:resume-request");
                  assert_eq!(message.role, Role::User);
                  assert_eq!(message.origin, Origin::Prompt);
                  let MessageContent::Parts { parts } = &message.content else {
                      panic!("resume prompt must use textual parts")
                  };
                  assert!(matches!(
                      parts.as_slice(),
                      [crate::model::ContentPart::Text { text }]
                          if text.contains("<resume>") && text.contains("make concrete progress")
                  ));
              }

              #[test]
              fn resume_with_pending_tools_does_not_inject_a_continuation_prompt() {
                  let messages = compile_resume_messages(
                      "resume-request",
                      &pb::RequestContext::default(),
                      &[],
                      true,
                  )
                  .unwrap();

                  assert!(messages.is_empty());
              }

              #[test]
              fn request_context_is_only_projected_when_its_content_changes() {
          ''',
          )

          # Decode the pending tool round before initial-message projection so
          # resume message generation knows whether a tool result will itself
          # provide the next model input.
          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''    let request_context = context::hydrate(request, context_sync).await?;
              let ActionProjection {
          ''',
              '''    let request_context = context::hydrate(request, context_sync).await?;
              let explicit_resume = is_explicit_resume(request);
              let ActionProjection {
          ''',
          )

          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''        background_completion,
              } = action(request)?;
              let checkpoint_mode = if request.subagent_type_name.is_some() {
          ''',
              '''        background_completion,
              } = action(request)?;
              let pending_tool_round = if !starts_turn && !compacting {
                  match request
                      .conversation_state
                      .as_ref()
                      .map(|state| state.pending_tool_calls.as_slice())
                      .unwrap_or_default()
                  {
                      [] => None,
                      [pending] => Some(projection::decode_pending(pending)?),
                      pending => {
                          return Err(Error::Protocol(format!(
                              "Cursor resume contains {} pending assistant messages",
                              pending.len()
                          )))
                      }
                  }
              } else {
                  None
              };
              let checkpoint_mode = if request.subagent_type_name.is_some() {
          ''',
          )

          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''        }
              };
              let (base_revision_id, reused) = store
          ''',
              '''        }
              };
              if explicit_resume {
                  initial_messages.extend(runtime::compile_resume_messages(
                      request_id,
                      &request_context,
                      base_messages.as_deref().unwrap_or_default(),
                      pending_tool_round.is_some(),
                  )?);
              }
              let (base_revision_id, reused) = store
          ''',
          )

          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''    } else {
                  let pending_tool_round = match request
                      .conversation_state
                      .as_ref()
                      .map(|state| state.pending_tool_calls.as_slice())
                      .unwrap_or_default()
                  {
                      [] => None,
                      [pending] => Some(projection::decode_pending(pending)?),
                      pending => {
                          return Err(Error::Protocol(format!(
                              "Cursor resume contains {} pending assistant messages",
                              pending.len()
                          )))
                      }
                  };
                  RunAction::Resume { pending_tool_round }
              };
          ''',
              '''    } else {
                  RunAction::Resume { pending_tool_round }
              };
          ''',
          )

          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''fn action(request: &pb::AgentRunRequest) -> Result<ActionProjection> {
          ''',
              '''fn is_explicit_resume(request: &pb::AgentRunRequest) -> bool {
              matches!(
                  request
                      .action
                      .as_ref()
                      .and_then(|action| action.action.as_ref()),
                  Some(pb::conversation_action::Action::ResumeAction(_))
              )
          }

          fn action(request: &pb::AgentRunRequest) -> Result<ActionProjection> {
          ''',
          )

          replace_once(
              "server/src/cursor/request/prepare.rs",
              '''    #[test]
              fn restored_system_root_is_structural_not_bound_to_the_next_model() {
          ''',
              '''    #[test]
              fn explicit_resume_action_is_detected() {
                  let request = pb::AgentRunRequest {
                      action: Some(pb::ConversationAction {
                          action: Some(pb::conversation_action::Action::ResumeAction(
                              pb::ResumeAction::default(),
                          )),
                          ..Default::default()
                      }),
                      ..Default::default()
                  };

                  assert!(is_explicit_resume(&request));
                  let projection = action(&request).unwrap();
                  assert!(!projection.starts_turn);
                  assert!(!projection.compacting);
              }

              #[test]
              fn restored_system_root_is_structural_not_bound_to_the_next_model() {
          ''',
          )

          # Keep the implementation note accurate after adding explicit resume
          # request-context and continuation handling.
          replace_once(
              "server/src/cursor/actor.rs",
              '''                                    //    ExecutePlanAction. ResumeAction only works indirectly through
                                      //    the absence of a new runtime event and still needs an explicit
                                      //    implementation that consumes ResumeAction.request_context.
          ''',
              '''                                    //    ExecutePlanAction. ResumeAction is consumed explicitly by
                                      //    request::prepare, including ResumeAction.request_context and a
                                      //    hidden continuation prompt when no pending tool result exists.
          ''',
          )

          Path("server/tests/resume_progress.rs").write_text(r'''#[path = "support/fake_provider.rs"]
          mod fake_provider;
          #[path = "support/fixtures.rs"]
          mod fixtures;

          use std::sync::Arc;

          use cursor_server::{
              cursor::{
                  connect,
                  prompting::{PromptAssets, PromptCompiler},
                  proto::agent::v1 as pb,
                  CursorCommand, CursorSessionHandle, CursorSessionRegistry,
              },
              model::{ContentPart, ProjectedContent, Role},
              provider::{FinishReason, ModelEvent},
          };
          use prost::Message;

          #[tokio::test]
          async fn resume_action_context_and_continuation_reach_the_next_model_call() {
              let (_directory, store) = fixtures::temp_store().await;
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("model-initial", "initial response"));
              provider.push(text_response("model-resumed", "continued response"));
              let assets = PromptAssets::load(
                  std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                      .join("prompt/cursor")
                      .as_path(),
              )
              .unwrap();
              let registry = CursorSessionRegistry::new(
                  store,
                  Arc::new(provider.clone()),
                  PromptCompiler::new(assets),
                  Default::default(),
              );

              let first = registry.get_or_create("initial-request").await.unwrap();
              let mut first_output = first.subscribe();
              first
                  .command(CursorCommand::Append {
                      seqno: 0,
                      message: Box::new(start_request()),
                  })
                  .await
                  .unwrap();
              let state = drive_to_end(&first, &mut first_output, 1).await;
              assert!(state.pending_tool_calls.is_empty());

              let resumed = registry.get_or_create("resume-request").await.unwrap();
              let mut resumed_output = resumed.subscribe();
              resumed
                  .command(CursorCommand::Append {
                      seqno: 0,
                      message: Box::new(resume_request(state)),
                  })
                  .await
                  .unwrap();
              let _ = drive_to_end(&resumed, &mut resumed_output, 1).await;

              let requests = provider.requests();
              assert_eq!(requests.len(), 2);
              let history = &requests[1].history;
              assert_eq!(
                  history
                      .iter()
                      .filter(|message| message.message_id.starts_with("request-context:"))
                      .count(),
                  2,
                  "the changed ResumeAction context must be appended to history"
              );
              let texts = history
                  .iter()
                  .filter_map(projected_text)
                  .collect::<Vec<_>>();
              assert!(texts.iter().any(|text| text.contains("Shell: pwsh")));
              let last = history.last().expect("resume history must not be empty");
              assert_eq!(last.role, Role::User);
              assert_eq!(last.message_id, "resume-prompt:resume-request");
              assert!(projected_text(last)
                  .as_deref()
                  .is_some_and(|text| text.contains("<resume>") && text.contains("make concrete progress")));
          }

          fn text_response(model_call_id: &str, text: &str) -> Vec<ModelEvent> {
              vec![
                  ModelEvent::Start {
                      model_call_id: model_call_id.into(),
                  },
                  ModelEvent::TextStart,
                  ModelEvent::TextDelta(text.into()),
                  ModelEvent::TextEnd,
                  ModelEvent::Done(FinishReason::Stop),
              ]
          }

          fn start_request() -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::RunRequest(
                      pb::AgentRunRequest {
                          action: Some(pb::ConversationAction {
                              action: Some(pb::conversation_action::Action::UserMessageAction(
                                  pb::UserMessageAction {
                                      user_message: Some(pb::UserMessage {
                                          text: "perform the task".into(),
                                          message_id: "user-1".into(),
                                          mode: pb::AgentMode::Agent as i32,
                                          ..Default::default()
                                      }),
                                      request_context: Some(request_context("bash")),
                                      ..Default::default()
                                  },
                              )),
                              ..Default::default()
                          }),
                          conversation_id: Some("resume-progress-conversation".into()),
                          run_id: Some("initial-wire-run".into()),
                          requested_model: Some(pb::RequestedModel {
                              model_id: "test-model".into(),
                              ..Default::default()
                          }),
                          ..Default::default()
                      },
                  )),
              }
          }

          fn resume_request(state: pb::ConversationStateStructure) -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::RunRequest(
                      pb::AgentRunRequest {
                          action: Some(pb::ConversationAction {
                              action: Some(pb::conversation_action::Action::ResumeAction(
                                  pb::ResumeAction {
                                      request_context: Some(request_context("pwsh")),
                                      ..Default::default()
                                  },
                              )),
                              ..Default::default()
                          }),
                          conversation_state: Some(state),
                          conversation_id: Some("resume-progress-conversation".into()),
                          run_id: Some("resume-wire-run".into()),
                          requested_model: Some(pb::RequestedModel {
                              model_id: "test-model".into(),
                              ..Default::default()
                          }),
                          ..Default::default()
                      },
                  )),
              }
          }

          fn request_context(shell: &str) -> pb::RequestContext {
              pb::RequestContext {
                  env: Some(pb::RequestContextEnv {
                      os_version: "windows".into(),
                      workspace_paths: vec!["C:/workspace".into()],
                      shell: shell.into(),
                      terminals_folder: "C:/terminals".into(),
                      agent_transcripts_folder: "C:/transcripts".into(),
                      ..Default::default()
                  }),
                  ..Default::default()
              }
          }

          fn projected_text(message: &cursor_server::model::ProjectedMessage) -> Option<String> {
              let ProjectedContent::Parts(parts) = &message.content else {
                  return None;
              };
              Some(
                  parts
                      .iter()
                      .filter_map(|part| match part {
                          ContentPart::Text { text } => Some(text.as_str()),
                          _ => None,
                      })
                      .collect::<Vec<_>>()
                      .join("\n"),
              )
          }

          async fn drive_to_end(
              handle: &CursorSessionHandle,
              output: &mut tokio::sync::mpsc::UnboundedReceiver<bytes::Bytes>,
              mut seqno: i64,
          ) -> pb::ConversationStateStructure {
              let mut latest = None;
              loop {
                  let frame = tokio::time::timeout(
                      std::time::Duration::from_secs(10),
                      output.recv(),
                  )
                  .await
                  .unwrap()
                  .unwrap();
                  let (flags, payload) = connect::decode_frames(&frame).unwrap().pop().unwrap();
                  if flags & connect::END_STREAM_FLAG != 0 {
                      break;
                  }
                  let server = pb::AgentServerMessage::decode(payload).unwrap();
                  match server.message {
                      Some(pb::agent_server_message::Message::KvServerMessage(kv)) => {
                          assert!(matches!(
                              kv.message,
                              Some(pb::kv_server_message::Message::SetBlobArgs(_))
                          ));
                          handle
                              .command(CursorCommand::Append {
                                  seqno,
                                  message: Box::new(pb::AgentClientMessage {
                                      message: Some(
                                          pb::agent_client_message::Message::KvClientMessage(
                                              pb::KvClientMessage {
                                                  id: kv.id,
                                                  message: Some(
                                                      pb::kv_client_message::Message::SetBlobResult(
                                                          pb::SetBlobResult { error: None },
                                                      ),
                                                  ),
                                              },
                                          ),
                                      ),
                                  }),
                              })
                              .await
                              .unwrap();
                          seqno += 1;
                      }
                      Some(
                          pb::agent_server_message::Message::ConversationCheckpointUpdate(state),
                      ) => latest = Some(state),
                      _ => {}
                  }
              }
              latest.expect("run must publish a checkpoint")
          }
          ''')

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run focused ResumeAction regression test
        run: cargo test -p cursor-server --test resume_progress -- --nocapture

      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/apply-resume-action-progress-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make ResumeAction advance the agent turn"
          git push origin HEAD:fix/resume-action-progress
