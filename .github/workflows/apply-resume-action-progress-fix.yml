                  .unwrap();

                  let [message] = messages.as_slice() else {
                      panic!("expected one continuation message")
                  };
                  assert_eq!(message.message_id, "resume-prompt:resume-request");
                  assert_eq!(message.role, Role::User);
                  assert_eq!(message.origin, Origin::Prompt);
                  let MessageContent::Parts { parts } = &message.content else {
                      panic!("resume prompt must use textual parts")
                  };
                  assert!(matches!(
