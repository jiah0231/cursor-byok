name: Apply and verify compaction recovery fix

on:
  push:
    branches:
      - fix/compaction-recovery-threshold

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply compaction durability and threshold fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          # Share one conservative token estimator between threshold decisions and
          # compacted Cursor checkpoints.
          Path("server/src/model/token_estimate.rs").write_text(r'''use serde::Serialize;

          use super::{CanonicalMessage, PromptSpec};

          pub(crate) fn estimate_context_tokens(
              prompt: &PromptSpec,
              messages: &[CanonicalMessage],
          ) -> u64 {
              estimate_serialized_tokens(&(prompt, messages))
          }

          pub(crate) fn estimate_message_tokens(messages: &[CanonicalMessage]) -> u64 {
              estimate_serialized_tokens(messages)
          }

          fn estimate_serialized_tokens(value: &(impl Serialize + ?Sized)) -> u64 {
              let serialized = serde_json::to_string(value).unwrap_or_default();
              serialized
                  .chars()
                  .fold(0_u64, |units, character| {
                      units.saturating_add(if character.is_ascii() { 273 } else { 550 })
                  })
                  .div_ceil(1_000)
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::model::{CanonicalMessage, Origin, Role};

              #[test]
              fn estimate_grows_with_serialized_context() {
                  let prompt = PromptSpec {
                      instructions: "system".into(),
                      tools: Vec::new(),
                  };
                  let short = vec![CanonicalMessage::text(
                      "short",
                      Role::User,
                      Origin::User,
                      "hello",
                  )];
                  let long = vec![CanonicalMessage::text(
                      "long",
                      Role::User,
                      Origin::User,
                      "x".repeat(100_000),
                  )];

                  assert!(estimate_context_tokens(&prompt, &long) > 25_000);
                  assert!(
                      estimate_context_tokens(&prompt, &long)
                          > estimate_context_tokens(&prompt, &short)
                  );
              }
          }
          '''.replace("          ", "", 1))

          replace_once(
              "server/src/model/mod.rs",
              "mod token_count;\nmod tool;\n",
              "mod token_count;\nmod token_estimate;\nmod tool;\n",
          )
          replace_once(
              "server/src/model/mod.rs",
              "pub(crate) use token_count::*;\npub use tool::*;\n",
              "pub(crate) use token_count::*;\npub(crate) use token_estimate::*;\npub use tool::*;\n",
          )

          # Make the saved provider output budget available to the RunEngine.
          replace_once(
              "server/src/model/configuration.rs",
              "        if model.context_window_tokens.is_none() {\n"
              "            model.context_window_tokens = self.context_window_tokens;\n"
              "        }\n"
              "        if model.reasoning.effort.is_none() {\n",
              "        if model.context_window_tokens.is_none() {\n"
              "            model.context_window_tokens = self.context_window_tokens;\n"
              "        }\n"
              "        if model.max_output_tokens.is_none() {\n"
              "            model.max_output_tokens = self.max_output_tokens();\n"
              "        }\n"
              "        if model.reasoning.effort.is_none() {\n",
          )

          # Reset Cursor's token meter to the compacted history instead of keeping
          # the pre-compaction used-token value.
          replace_once(
              "server/src/cursor/checkpoint/summary.rs",
              "    model::CanonicalMessage,\n",
              "    model::{estimate_context_tokens, CanonicalMessage, PromptSpec},\n",
          )
          replace_once(
              "server/src/cursor/checkpoint/summary.rs",
              "        self.base.self_summary_count = self.base.self_summary_count.saturating_add(1);\n"
              "        if let Some(details) = self.base.token_details.as_mut() {\n",
              "        self.base.self_summary_count = self.base.self_summary_count.saturating_add(1);\n"
              "        let compacted_prompt = PromptSpec {\n"
              "            instructions: self.instructions.clone(),\n"
              "            tools: self.tool_definitions.clone(),\n"
              "        };\n"
              "        self.record_context_tokens(Some(estimate_context_tokens(\n"
              "            &compacted_prompt,\n"
              "            messages,\n"
              "        )));\n"
              "        if let Some(details) = self.base.token_details.as_mut() {\n",
          )

          # Publish an automatic-compaction checkpoint before the next provider
          # call. If that call fails, Cursor can retry from the compressed state.
          replace_once(
              "server/src/cursor/session.rs",
              "                                Ok(checkpoint) => {\n"
              "                                    compaction_checkpoint = Some(checkpoint);\n"
              "                                    state.barrier.complete(Ok(()));\n"
              "                                }\n",
              "                                Ok(checkpoint) => {\n"
              "                                    if self.context.compacting {\n"
              "                                        compaction_checkpoint = Some(checkpoint);\n"
              "                                    } else if let Err(error) =\n"
              "                                        self.checkpoint.publish(&self.handle, &checkpoint).await\n"
              "                                    {\n"
              "                                        state.barrier.complete(Err(error.to_string()));\n"
              "                                        return Err(error);\n"
              "                                    }\n"
              "                                    state.barrier.complete(Ok(()));\n"
              "                                }\n",
          )

          engine_path = Path("server/src/run/engine.rs")
          engine = engine_path.read_text()
          engine = engine.replace(
              "const COMPACTION_RESERVE_TOKENS: u64 = 10_000;\n"
              "const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;\n",
              "const COMPACTION_MIN_RESERVE_TOKENS: u64 = 10_000;\n"
              "const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;\n"
              "const COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;\n",
              1,
          )
          if "COMPACTION_MIN_RESERVE_TOKENS" not in engine:
              raise SystemExit("engine constants were not patched")
          engine = engine.replace(
              "        let mut auto_compacted = prepared.action == RunAction::Compact;\n",
              "        let mut last_auto_compaction_revision = None;\n",
              1,
          )
          old = '''            let context_anchor = if !auto_compacted && prepared.action == RunAction::Start {
              match self
                  .store
                  .latest_llm_call_usage_anchor(
                      &prepared.conversation_id,
                      &prepared.model.model_id,
                  )
                  .await
              {
                  Ok(anchor) => anchor.and_then(ContextUsageAnchor::from_llm_call),
                  Err(error) => return (RunOutcome::Failed(error.into()), usage),
              }
          } else {
              None
          };
          if !auto_compacted && should_auto_compact(prepared, &messages, context_anchor) {
              auto_compacted = true;
          '''
          new = '''            let can_auto_compact = auto_compaction_allowed(
              &prepared.action,
              revision,
              last_auto_compaction_revision,
          );
          let context_anchor = if can_auto_compact {
              match self
                  .store
                  .latest_llm_call_usage_anchor(
                      &prepared.conversation_id,
                      &prepared.model.model_id,
                  )
                  .await
              {
                  Ok(anchor) => anchor.and_then(ContextUsageAnchor::from_llm_call),
                  Err(error) => return (RunOutcome::Failed(error.into()), usage),
              }
          } else {
              None
          };
          if can_auto_compact && should_auto_compact(prepared, &messages, context_anchor) {
          '''
          if engine.count(old) != 1:
              raise SystemExit("engine auto-compaction gate did not match exactly")
          engine = engine.replace(old, new, 1)
          old = '''                    Ok((next_revision, compaction_usage)) => {
              revision = next_revision;
          '''
          new = '''                    Ok((next_revision, compaction_usage)) => {
              revision = next_revision;
              last_auto_compaction_revision = Some(revision);
          '''
          if engine.count(old) != 1:
              raise SystemExit("engine compaction success arm did not match exactly")
          engine = engine.replace(old, new, 1)

          start = engine.index("fn should_auto_compact(")
          end = engine.index("fn fallback_summary(", start)
          engine = engine[:start] + r'''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              *action == RunAction::Start && last_auto_compaction_revision != Some(revision)
          }

          fn compaction_input_limit(prepared: &PreparedRun) -> Option<u64> {
              let context_window = prepared.model.context_window_tokens?;
              let reserve = prepared
                  .model
                  .max_output_tokens
                  .unwrap_or_default()
                  .saturating_add(COMPACTION_OUTPUT_SAFETY_TOKENS)
                  .max(COMPACTION_MIN_RESERVE_TOKENS);
              Some(context_window.saturating_sub(reserve))
          }

          fn should_auto_compact(
              prepared: &PreparedRun,
              messages: &[CanonicalMessage],
              anchor: Option<ContextUsageAnchor>,
          ) -> bool {
              if prepared.action != RunAction::Start
                  || messages.len() <= prepared.initial_messages.len()
              {
                  return false;
              }
              let Some(input_limit) = compaction_input_limit(prepared) else {
                  return false;
              };
              let estimated_input = anchor
                  .filter(|anchor| {
                      anchor.message_count <= messages.len()
                          && anchor.tool_count == prepared.prompt.tools.len()
                  })
                  .map(|anchor| {
                      anchor.input_tokens.saturating_add(
                          crate::model::estimate_message_tokens(
                              &messages[anchor.message_count..],
                          ),
                      )
                  })
                  .unwrap_or_else(|| {
                      crate::model::estimate_context_tokens(&prepared.prompt, messages)
                  });
              estimated_input >= input_limit
          }

          '''.replace("          ", "", 1) + engine[end:]

          old = '''    use super::{
              auto_compaction_partition, estimate_context_tokens, hydrate_tool_images,
              should_auto_compact, ContextUsageAnchor,
          };
          '''
          new = '''    use super::{
              auto_compaction_allowed, auto_compaction_partition, compaction_input_limit,
              hydrate_tool_images, should_auto_compact, ContextUsageAnchor,
          };
          '''
          if engine.count(old) != 1:
              raise SystemExit("engine test imports did not match")
          engine = engine.replace(old, new, 1)
          engine = engine.replace(
              "            CanonicalMessage, ContentPart, ConversationId, ModelSpec, Origin, PreparedRun,\n",
              "            estimate_context_tokens, CanonicalMessage, ContentPart, ConversationId,\n"
              "            ModelSpec, Origin, PreparedRun,\n",
              1,
          )

          marker = '''    #[test]
          fn auto_compaction_preserves_only_the_latest_request_context() {
          '''
          tests = r'''    #[test]
          fn configured_output_budget_is_reserved_for_the_next_model_call() {
              let current = CanonicalMessage::text(
                  "runtime:current",
                  Role::User,
                  Origin::Runtime,
                  "current request",
              );
              let mut prepared = PreparedRun {
                  run_id: RunId::new("run"),
                  cursor_request_id: None,
                  conversation_id: ConversationId::new("conversation"),
                  kind: RunKind::Root,
                  model: ModelSpec {
                      context_window_tokens: Some(100_000),
                      ..ModelSpec::new("model")
                  },
                  prompt: PromptSpec {
                      instructions: "system".into(),
                      tools: Vec::new(),
                  },
                  initial_messages: vec![current],
                  action: RunAction::Start,
                  base_revision_id: RevisionId(1),
              };

              assert_eq!(compaction_input_limit(&prepared), Some(90_000));
              prepared.model.max_output_tokens = Some(32_000);
              assert_eq!(compaction_input_limit(&prepared), Some(63_904));
          }

          #[test]
          fn automatic_compaction_triggers_at_the_exact_input_limit() {
              let old = CanonicalMessage::text(
                  "old",
                  Role::User,
                  Origin::User,
                  "old history",
              );
              let current = CanonicalMessage::text(
                  "runtime:current",
                  Role::User,
                  Origin::Runtime,
                  "current request",
              );
              let messages = vec![old, current.clone()];
              let prepared = PreparedRun {
                  run_id: RunId::new("run"),
                  cursor_request_id: None,
                  conversation_id: ConversationId::new("conversation"),
                  kind: RunKind::Root,
                  model: ModelSpec {
                      context_window_tokens: Some(100_000),
                      ..ModelSpec::new("model")
                  },
                  prompt: PromptSpec {
                      instructions: "system".into(),
                      tools: Vec::new(),
                  },
                  initial_messages: vec![current],
                  action: RunAction::Start,
                  base_revision_id: RevisionId(1),
              };
              let anchor = ContextUsageAnchor {
                  input_tokens: compaction_input_limit(&prepared).unwrap(),
                  message_count: messages.len(),
                  tool_count: 0,
              };

              assert!(should_auto_compact(&prepared, &messages, Some(anchor)));
          }

          #[test]
          fn automatic_compaction_rearms_only_after_the_revision_advances() {
              assert!(auto_compaction_allowed(
                  &RunAction::Start,
                  RevisionId(2),
                  None,
              ));
              assert!(!auto_compaction_allowed(
                  &RunAction::Start,
                  RevisionId(2),
                  Some(RevisionId(2)),
              ));
              assert!(auto_compaction_allowed(
                  &RunAction::Start,
                  RevisionId(3),
                  Some(RevisionId(2)),
              ));
              assert!(!auto_compaction_allowed(
                  &RunAction::Compact,
                  RevisionId(3),
                  None,
              ));
          }

          '''.replace("          ", "", 1)
          if engine.count(marker) != 1:
              raise SystemExit("engine unit-test insertion marker did not match")
          engine = engine.replace(marker, tests + marker, 1)
          engine_path.write_text(engine)

          # End-to-end regression: compaction is committed and published, the
          # immediate provider call fails, and a ResumeAction continues from the
          # emitted compacted checkpoint. The synthetic usage anchor also proves
          # that the configured output budget changes the automatic threshold.
          Path("server/tests/compaction_recovery.rs").write_text(r'''#[path = "support/fake_provider.rs"]
          mod fake_provider;
          #[path = "support/fixtures.rs"]
          mod fixtures;

          use std::{collections::HashMap, sync::Arc, time::Duration};

          use cursor_server::{
              cursor::prompting::{PromptAssets, PromptCompiler},
              cursor::{connect, proto::agent::v1 as pb, CursorCommand, CursorSessionRegistry},
              model::{
                  ContentPart, ConversationId, ModelConfigInput, ModelType, NewLlmCall,
                  ProjectedContent, ProjectedMessage, ProviderType, Role, Usage,
                  OPENAI_CHAT_ENDPOINT,
              },
              provider::{FinishReason, ModelEvent},
              Error,
          };
          use prost::Message;

          #[tokio::test]
          async fn compacted_checkpoint_survives_followup_error_and_resume_continues() {
              let (_directory, store) = fixtures::temp_store().await;
              let model = store
                  .create_model(&ModelConfigInput {
                      sort_order: 0,
                      display_name: "Threshold Model".into(),
                      model_type: ModelType::OpenAi,
                      base_url: "https://example.com/v1/chat/completions".into(),
                      use_full_url: true,
                      api_key: "test-key".into(),
                      tooltip_data: "Threshold Model".into(),
                      model_id: "threshold-model".into(),
                      reasoning_effort: None,
                      openai_endpoint: OPENAI_CHAT_ENDPOINT.into(),
                      openai_extra_params_enabled: false,
                      openai_extra_params: serde_json::json!({}),
                      custom_headers_enabled: false,
                      custom_headers: serde_json::json!({}),
                      anthropic_extra_params_enabled: false,
                      anthropic_extra_params: serde_json::json!({}),
                      context_window_tokens: Some(150_000),
                      max_completion_tokens: Some(16_000),
                      anthropic_max_tokens: None,
                      anthropic_thinking_effort: None,
                      thinking_budget_tokens: None,
                  })
                  .await
                  .unwrap();
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("first answer marker", 132_000, 100));
              provider.push(text_response(
                  "Durable summary: current task remains unfinished.",
                  132_100,
                  20,
              ));
              provider.push_error(Error::Provider("post-compaction failure".into()));
              provider.push(text_response("recovered answer", 2_000, 10));

              let assets = PromptAssets::load(
                  std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                      .join("prompt/cursor")
                      .as_path(),
              )
              .unwrap();
              let registry = CursorSessionRegistry::new(
                  store.clone(),
                  Arc::new(provider.clone()),
                  PromptCompiler::new(assets),
                  Default::default(),
              );

              let first = run(
                  &registry,
                  "first-request",
                  user_request(
                      "compaction-recovery-conversation",
                      "first-user",
                      "remember the first answer marker",
                      &model.model_hash,
                      None,
                  ),
              )
              .await;
              assert!(first.end_error.is_none());
              let first_state = first.checkpoints.last().unwrap().clone();
              let first_used = first_state.token_details.as_ref().unwrap().used_tokens;
              assert_eq!(first_used, 132_100);

              let prior_message_count = store
                  .load_current_messages(&ConversationId::new(
                      "compaction-recovery-conversation",
                  ))
                  .await
                  .unwrap()
                  .len();
              let first_request = provider.requests().into_iter().next().unwrap();
              record_threshold_anchor(
                  &store,
                  &model,
                  prior_message_count,
                  first_request.prompt.tools.len(),
              )
              .await;

              let failed = run(
                  &registry,
                  "failing-request",
                  user_request(
                      "compaction-recovery-conversation",
                      "current-user",
                      "continue-current-work-marker",
                      &model.model_hash,
                      Some(first_state),
                  ),
              )
              .await;

              assert_eq!(failed.summary_started, 1);
              assert_eq!(failed.summary_completed, 1);
              assert!(failed
                  .end_error
                  .as_deref()
                  .is_some_and(|error| error.contains("post-compaction failure")));

              let compacted_state = failed
                  .checkpoints
                  .iter()
                  .rev()
                  .find(|state| state.summary.is_some())
                  .cloned()
                  .expect("automatic compaction must publish its checkpoint before continuing");
              let compacted_details = compacted_state.token_details.as_ref().unwrap();
              assert_eq!(compacted_details.max_tokens, 150_000);
              assert!(
                  compacted_details.used_tokens < first_used,
                  "the compacted checkpoint must reset the stale pre-compaction token count"
              );
              let summary_id = compacted_state.summary.as_ref().unwrap();
              let summary = pb::ConversationSummary::decode(
                  failed
                      .blobs
                      .get(summary_id)
                      .expect("published summary Blob")
                      .as_slice(),
              )
              .unwrap();
              assert_eq!(
                  summary.summary,
                  "Durable summary: current task remains unfinished."
              );

              let recovered = run(
                  &registry,
                  "resume-request",
                  resume_request(
                      "compaction-recovery-conversation",
                      &model.model_hash,
                      compacted_state,
                  ),
              )
              .await;
              assert!(recovered.end_error.is_none());
              assert!(!recovered.checkpoints.is_empty());

              let requests = provider.requests();
              assert_eq!(requests.len(), 4);
              assert!(requests[1].prompt.tools.is_empty());
              let failed_history = history_text(&requests[2].history);
              assert!(failed_history.contains("Durable summary"));
              assert!(failed_history.contains("continue-current-work-marker"));
              assert!(!failed_history.contains("first answer marker"));
              let resumed_history = history_text(&requests[3].history);
              assert!(resumed_history.contains("Durable summary"));
              assert!(resumed_history.contains("continue-current-work-marker"));
              assert!(resumed_history.contains("<resume>"));
              assert!(!resumed_history.contains("first answer marker"));
              assert_eq!(requests[3].history.last().unwrap().role, Role::User);
          }

          async fn record_threshold_anchor(
              store: &cursor_server::store::Store,
              model: &cursor_server::model::ModelConfig,
              message_count: usize,
              tool_count: usize,
          ) {
              let call_id = "synthetic-threshold-anchor";
              let provider_type = model.provider_type();
              store
                  .start_llm_call(&NewLlmCall {
                      call_id: call_id.into(),
                      run_id: "synthetic-anchor-run".into(),
                      conversation_id: "compaction-recovery-conversation".into(),
                      provider_call_index: 0,
                      model_hash: model.model_hash.clone(),
                      provider_type,
                      provider_url: model.base_url.clone(),
                      request_type: provider_type,
                      request_url: model.request_url().unwrap(),
                      model_id: model.model_id.clone(),
                      display_name: model.display_name.clone(),
                      reasoning_effort: None,
                      fast: false,
                      message_count,
                      tool_count,
                      detailed: false,
                  })
                  .await
                  .unwrap();
              store
                  .record_llm_usage(
                      call_id,
                      Usage {
                          input_tokens: Some(132_000),
                          output_tokens: Some(100),
                          total_tokens: Some(132_100),
                          ..Default::default()
                      },
                  )
                  .await
                  .unwrap();
              store
                  .finish_llm_call(call_id, "completed", Some("stop"), 1, None, None)
                  .await
                  .unwrap();
          }

          #[derive(Default)]
          struct Output {
              checkpoints: Vec<pb::ConversationStateStructure>,
              blobs: HashMap<Vec<u8>, Vec<u8>>,
              summary_started: usize,
              summary_completed: usize,
              end_error: Option<String>,
          }

          async fn run(
              registry: &CursorSessionRegistry,
              request_id: &str,
              request: pb::AgentClientMessage,
          ) -> Output {
              let handle = registry.get_or_create(request_id).await.unwrap();
              let mut receiver = handle.subscribe();
              handle
                  .command(CursorCommand::Append {
                      seqno: 0,
                      message: Box::new(request),
                  })
                  .await
                  .unwrap();
              let mut append_seqno = 1;
              let mut output = Output::default();
              loop {
                  let frame = tokio::time::timeout(Duration::from_secs(30), receiver.recv())
                      .await
                      .unwrap()
                      .unwrap();
                  let (flags, payload) = connect::decode_frames(&frame).unwrap().pop().unwrap();
                  if flags & connect::END_STREAM_FLAG != 0 {
                      let text = String::from_utf8_lossy(&payload).into_owned();
                      if text.contains("error") {
                          output.end_error = Some(text);
                      }
                      return output;
                  }
                  let server = pb::AgentServerMessage::decode(payload).unwrap();
                  match server.message {
                      Some(pb::agent_server_message::Message::KvServerMessage(kv)) => {
                          if let Some(pb::kv_server_message::Message::SetBlobArgs(set)) = kv.message {
                              output.blobs.insert(set.blob_id, set.blob_data);
                          }
                          handle
                              .command(CursorCommand::Append {
                                  seqno: append_seqno,
                                  message: Box::new(kv_ack(kv.id)),
                              })
                              .await
                              .unwrap();
                          append_seqno += 1;
                      }
                      Some(pb::agent_server_message::Message::ConversationCheckpointUpdate(
                          state,
                      )) => output.checkpoints.push(state),
                      Some(pb::agent_server_message::Message::InteractionUpdate(update)) => {
                          match update.message {
                              Some(pb::interaction_update::Message::SummaryStarted(_)) => {
                                  output.summary_started += 1
                              }
                              Some(pb::interaction_update::Message::SummaryCompleted(_)) => {
                                  output.summary_completed += 1
                              }
                              _ => {}
                          }
                      }
                      _ => {}
                  }
              }
          }

          fn text_response(text: impl Into<String>, input: u64, output: u64) -> Vec<ModelEvent> {
              let text = text.into();
              let model_call_id = format!("call-{}", text.len());
              vec![
                  ModelEvent::Start { model_call_id },
                  ModelEvent::TextStart,
                  ModelEvent::TextDelta(text),
                  ModelEvent::TextEnd,
                  ModelEvent::Usage(Usage {
                      input_tokens: Some(input),
                      output_tokens: Some(output),
                      total_tokens: Some(input + output),
                      ..Default::default()
                  }),
                  ModelEvent::Done(FinishReason::Stop),
              ]
          }

          fn history_text(history: &[ProjectedMessage]) -> String {
              let mut output = String::new();
              for message in history {
                  match &message.content {
                      ProjectedContent::Parts(parts) => {
                          for part in parts {
                              if let ContentPart::Text { text } = part {
                                  output.push_str(text);
                                  output.push('\n');
                              }
                          }
                      }
                      ProjectedContent::Assistant { text, thinking, .. } => {
                          output.push_str(text);
                          output.push('\n');
                          output.push_str(thinking);
                          output.push('\n');
                      }
                      ProjectedContent::ToolResult(result) => {
                          output.push_str(&result.content);
                          output.push('\n');
                      }
                  }
              }
              output
          }

          fn user_request(
              conversation_id: &str,
              message_id: &str,
              text: &str,
              model_id: &str,
              state: Option<pb::ConversationStateStructure>,
          ) -> pb::AgentClientMessage {
              request(
                  conversation_id,
                  model_id,
                  state,
                  pb::conversation_action::Action::UserMessageAction(pb::UserMessageAction {
                      user_message: Some(pb::UserMessage {
                          text: text.into(),
                          message_id: message_id.into(),
                          mode: pb::AgentMode::Agent as i32,
                          ..Default::default()
                      }),
                      request_context: Some(pb::RequestContext::default()),
                      ..Default::default()
                  }),
              )
          }

          fn resume_request(
              conversation_id: &str,
              model_id: &str,
              state: pb::ConversationStateStructure,
          ) -> pb::AgentClientMessage {
              request(
                  conversation_id,
                  model_id,
                  Some(state),
                  pb::conversation_action::Action::ResumeAction(pb::ResumeAction {
                      request_context: Some(pb::RequestContext::default()),
                      ..Default::default()
                  }),
              )
          }

          fn request(
              conversation_id: &str,
              model_id: &str,
              state: Option<pb::ConversationStateStructure>,
              action: pb::conversation_action::Action,
          ) -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::RunRequest(
                      pb::AgentRunRequest {
                          requested_model: Some(pb::RequestedModel {
                              model_id: model_id.into(),
                              ..Default::default()
                          }),
                          action: Some(pb::ConversationAction {
                              action: Some(action),
                              ..Default::default()
                          }),
                          conversation_id: Some(conversation_id.into()),
                          conversation_state: state,
                          run_id: Some("reusable-wire-run-id".into()),
                          ..Default::default()
                      },
                  )),
              }
          }

          fn kv_ack(id: u32) -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::KvClientMessage(
                      pb::KvClientMessage {
                          id,
                          message: Some(pb::kv_client_message::Message::SetBlobResult(
                              pb::SetBlobResult { error: None },
                          )),
                      },
                  )),
              }
          }
          '''.replace("          ", "", 1))

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run compaction recovery regression
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture

      - name: Run existing compaction regression suite
        run: cargo test -p cursor-server --test compaction -- --nocapture

      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit tested fix
        shell: bash
        run: |
          git rm .github/workflows/apply-compaction-recovery-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/model/mod.rs \
                  server/src/model/token_estimate.rs \
                  server/src/model/configuration.rs \
                  server/src/cursor/checkpoint/summary.rs \
                  server/src/cursor/session.rs \
                  server/src/run/engine.rs \
                  server/tests/compaction_recovery.rs
          git commit -m "fix: make compaction durable and threshold-aware"
          git push origin HEAD:fix/compaction-recovery-threshold
