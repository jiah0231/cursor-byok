name: Apply official model options observability fix

on:
  push:
    branches:
      - fix/official-model-options-observability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "server/src/model/cursor_trace.rs",
              "    pub model_id: Option<String>,\n    pub status: String,\n",
              "    pub model_id: Option<String>,\n    pub reasoning_effort: Option<String>,\n    pub fast: Option<bool>,\n    pub status: String,\n",
          )

          replace_once(
              "server/src/store/cursor_traces.rs",
              "        route: &str,\n        model_id: Option<&str>,\n    ) -> Result<bool> {\n",
              "        route: &str,\n        model_id: Option<&str>,\n        reasoning_effort: Option<&str>,\n        fast: Option<bool>,\n    ) -> Result<bool> {\n",
          )
          replace_once(
              "server/src/store/cursor_traces.rs",
              "            \"INSERT OR IGNORE INTO cursor_run_traces(\n                request_id, conversation_id, route, model_id, status, received_at_ms\n             ) VALUES (?, ?, ?, ?, 'running', ?)\",\n",
              "            \"INSERT OR IGNORE INTO cursor_run_traces(\n                request_id, conversation_id, route, model_id, reasoning_effort, fast,\n                status, received_at_ms\n             ) VALUES (?, ?, ?, ?, ?, ?, 'running', ?)\",\n",
          )
          replace_once(
              "server/src/store/cursor_traces.rs",
              "        .bind(model_id)\n        .bind(now_ms())\n",
              "        .bind(model_id)\n        .bind(reasoning_effort)\n        .bind(fast.map(|value| if value { 1_i64 } else { 0_i64 }))\n        .bind(now_ms())\n",
          )
          replace_once(
              "server/src/store/cursor_traces.rs",
              "        model_id: row.try_get(\"model_id\")?,\n        status: row.try_get(\"status\")?,\n",
              "        model_id: row.try_get(\"model_id\")?,\n        reasoning_effort: row.try_get(\"reasoning_effort\")?,\n        fast: row\n            .try_get::<Option<i64>, _>(\"fast\")?\n            .map(|value| value != 0),\n        status: row.try_get(\"status\")?,\n",
          )
          replace_once(
              "server/src/store/cursor_traces.rs",
              ".start_cursor_trace_if_detailed(\"trace\", None, \"cursor_official\", None)\n",
              ".start_cursor_trace_if_detailed(\n                \"trace\",\n                None,\n                \"cursor_official\",\n                None,\n                None,\n                None,\n            )\n",
          )

          replace_once(
              "server/src/cursor/observability.rs",
              "        route: &str,\n        model_id: Option<&str>,\n    ) -> Option<Self> {\n",
              "        route: &str,\n        model_id: Option<&str>,\n        reasoning_effort: Option<&str>,\n        fast: Option<bool>,\n    ) -> Option<Self> {\n",
          )
          replace_once(
              "server/src/cursor/observability.rs",
              "            .start_cursor_trace_if_detailed(request_id, conversation_id, route, model_id)\n",
              "            .start_cursor_trace_if_detailed(\n                request_id,\n                conversation_id,\n                route,\n                model_id,\n                reasoning_effort,\n                fast,\n            )\n",
          )

          replace_once(
              "server/src/cursor/bidi_append.rs",
              "    pub fn conversation_id(&self) -> Option<&str> {\n",
              '''    pub fn reasoning_effort(&self) -> Option<&str> {\n        let agent::agent_client_message::Message::RunRequest(request) =\n            self.message.message.as_ref()?\n        else {\n            return None;\n        };\n        request\n            .requested_model\n            .as_ref()?\n            .parameters\n            .iter()\n            .rev()\n            .find(|parameter| matches!(parameter.id.as_str(), \"effort\" | \"reasoning\"))\n            .and_then(|parameter| {\n                let effort = parameter.value.trim();\n                (!effort.is_empty() && effort != \"none\").then_some(effort)\n            })\n    }\n\n    pub fn fast(&self) -> Option<bool> {\n        let agent::agent_client_message::Message::RunRequest(request) =\n            self.message.message.as_ref()?\n        else {\n            return None;\n        };\n        request\n            .requested_model\n            .as_ref()?\n            .parameters\n            .iter()\n            .rev()\n            .find(|parameter| parameter.id == \"fast\")\n            .and_then(|parameter| match parameter.value.trim() {\n                \"true\" => Some(true),\n                \"false\" => Some(false),\n                _ => None,\n            })\n    }\n\n    pub fn conversation_id(&self) -> Option<&str> {\n''',
          )
          replace_once(
              "server/src/cursor/bidi_append.rs",
              "            \"model_id\": self.model_id(),\n            \"action_type\": action_type,\n",
              "            \"model_id\": self.model_id(),\n            \"reasoning_effort\": self.reasoning_effort(),\n            \"fast\": self.fast(),\n            \"action_type\": action_type,\n",
          )
          replace_once(
              "server/src/cursor/bidi_append.rs",
              "    #[test]\n    fn route_model_uses_legacy_model_details_when_needed() {\n",
              '''    #[test]\n    fn captures_requested_model_options_for_observability() {\n        let decoded = decode(&encoded(agent::AgentRunRequest {\n            requested_model: Some(agent::RequestedModel {\n                model_id: \"grok-4.6\".into(),\n                parameters: vec![\n                    agent::requested_model::ModelParameterValue {\n                        id: \"effort\".into(),\n                        value: \"high\".into(),\n                    },\n                    agent::requested_model::ModelParameterValue {\n                        id: \"fast\".into(),\n                        value: \"false\".into(),\n                    },\n                ],\n                ..Default::default()\n            }),\n            ..Default::default()\n        }))\n        .unwrap();\n\n        assert_eq!(decoded.reasoning_effort(), Some(\"high\"));\n        assert_eq!(decoded.fast(), Some(false));\n        assert_eq!(decoded.trace_metadata()[\"reasoning_effort\"], \"high\");\n        assert_eq!(decoded.trace_metadata()[\"fast\"], false);\n    }\n\n    #[test]\n    fn route_model_uses_legacy_model_details_when_needed() {\n''',
          )

          replace_once(
              "server/src/cursor/handlers.rs",
              "    let first_model = decoded.model_id().map(str::to_owned);\n    let conversation_id = decoded.conversation_id().map(str::to_owned);\n    let trace_metadata = decoded.trace_metadata();\n",
              "    let first_model = decoded.model_id().map(str::to_owned);\n    let conversation_id = decoded.conversation_id().map(str::to_owned);\n    let reasoning_effort = decoded.reasoning_effort().map(str::to_owned);\n    let fast = decoded.fast();\n    let trace_metadata = decoded.trace_metadata();\n",
          )
          replace_once(
              "server/src/cursor/handlers.rs",
              "            first_model.as_deref(),\n        )\n",
              "            first_model.as_deref(),\n            reasoning_effort.as_deref(),\n            fast,\n        )\n",
          )
          replace_once(
              "server/src/cursor/handlers.rs",
              '''                    requested_model: Some(agent::RequestedModel {\n                        model_id: \"grok-4.6\".into(),\n                        ..Default::default()\n                    }),\n''',
              '''                    requested_model: Some(agent::RequestedModel {\n                        model_id: \"grok-4.6\".into(),\n                        parameters: vec![\n                            agent::requested_model::ModelParameterValue {\n                                id: \"effort\".into(),\n                                value: \"high\".into(),\n                            },\n                            agent::requested_model::ModelParameterValue {\n                                id: \"fast\".into(),\n                                value: \"true\".into(),\n                            },\n                        ],\n                        ..Default::default()\n                    }),\n''',
          )
          replace_once(
              "server/src/cursor/handlers.rs",
              "        assert_eq!(trace.route, \"cursor_official\");\n",
              "        assert_eq!(trace.route, \"cursor_official\");\n        assert_eq!(trace.reasoning_effort.as_deref(), Some(\"high\"));\n        assert_eq!(trace.fast, Some(true));\n",
          )

          replace_once(
              "server/src/cursor/run_sse.rs",
              "            Some(\"model\"),\n        )\n",
              "            Some(\"model\"),\n            None,\n            None,\n        )\n",
          )

          replace_once(
              "server/src/control/service.rs",
              "            reasoning_effort: None,\n            fast: None,\n",
              "            reasoning_effort: trace.reasoning_effort.clone(),\n            fast: trace.fast,\n",
          )

          path = Path("server/tests/observability.rs")
          text = path.read_text()
          old = '''        .start_cursor_trace_if_detailed(\n            \"request-disabled\",\n            Some(\"conversation\"),\n            \"local_byok\",\n            Some(\"model\"),\n        )\n'''
          new = '''        .start_cursor_trace_if_detailed(\n            \"request-disabled\",\n            Some(\"conversation\"),\n            \"local_byok\",\n            Some(\"model\"),\n            None,\n            None,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("observability disabled trace call did not match exactly once")
          text = text.replace(old, new, 1)
          old = '''        .start_cursor_trace_if_detailed(\n            \"request-enabled\",\n            Some(\"conversation\"),\n            \"cursor_official\",\n            Some(\"official-model\"),\n        )\n'''
          new = '''        .start_cursor_trace_if_detailed(\n            \"request-enabled\",\n            Some(\"conversation\"),\n            \"cursor_official\",\n            Some(\"official-model\"),\n            Some(\"high\"),\n            Some(false),\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("observability enabled trace call did not match exactly once")
          text = text.replace(old, new, 1)
          old = '''        .start_cursor_trace_if_detailed(\n            \"request-atomic\",\n            Some(\"conversation\"),\n            \"cursor_official\",\n            Some(\"model\"),\n        )\n'''
          new = '''        .start_cursor_trace_if_detailed(\n            \"request-atomic\",\n            Some(\"conversation\"),\n            \"cursor_official\",\n            Some(\"model\"),\n            None,\n            None,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("observability atomic trace call did not match exactly once")
          text = text.replace(old, new, 1)
          old = '    assert_eq!(trace.route, "cursor_official");\n    assert_eq!(trace.status, "completed");\n'
          new = '    assert_eq!(trace.route, "cursor_official");\n    assert_eq!(trace.reasoning_effort.as_deref(), Some("high"));\n    assert_eq!(trace.fast, Some(false));\n    assert_eq!(trace.status, "completed");\n'
          if text.count(old) != 1:
              raise SystemExit("observability trace assertions did not match exactly once")
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path("server/migrations/0005_cursor_trace_model_options.sql").write_text(
              "ALTER TABLE cursor_run_traces ADD COLUMN reasoning_effort TEXT;\n"
              "ALTER TABLE cursor_run_traces ADD COLUMN fast INTEGER;\n"
          )
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets
      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/apply-official-model-options-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: record official model effort and fast options"
          git push origin HEAD:fix/official-model-options-observability
