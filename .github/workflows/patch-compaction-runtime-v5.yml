name: Verify runtime compaction patch v5
on:
  push:
    branches: [fix/compaction-during-resume-timeout]
    paths:
      - .github/workflows/patch-compaction-runtime-v5.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Reset product files to clean base
        run: git checkout origin/fix/compaction-recovery-threshold -- server/src/run/engine.rs server/tests/compaction_recovery.rs
      - name: Apply product patch
        run: |
          python -m pip install --quiet pyyaml
          python .github/scripts/apply_compaction_runtime_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compaction recovery and Resume E2E
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture --test-threads=1
      - name: Engine unit tests
        run: cargo test -p cursor-server run::engine::tests -- --nocapture
      - name: Existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture
      - name: Resume regression
        run: cargo test -p cursor-server --test resume_progress -- --nocapture
      - name: Full server suite
        run: cargo test -p cursor-server --all-targets
      - name: Diff check
        run: git diff --check
      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/run/engine.rs server/tests/compaction_recovery.rs
          git commit -m "fix: compact throughout resumed work and bound summary latency"
          git push origin HEAD:fix/compaction-during-resume-timeout
