name: Apply ResumeAction progress fix v3

on:
  push:
    branches:
      - fix/resume-action-progress

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply ResumeAction fix
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              changed, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one regex match, found {count}: {pattern!r}"
                  )
              file.write_text(changed)

          # ResumeAction carries a current RequestContext. Upstream currently
          # drops it, so the resumed model call may be made with stale context.
          replace_once(
              "server/src/cursor/request/context.rs",
              "            pb::conversation_action::Action::ExecutePlanAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            _ => None,\n",
              "            pb::conversation_action::Action::ExecutePlanAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            pb::conversation_action::Action::ResumeAction(action) => {\n"
              "                action.request_context.as_ref()\n"
              "            }\n"
              "            _ => None,\n",
          )

          # A ResumeAction without a pending tool result otherwise calls the
          # model with unchanged history ending in the previous assistant turn.
          # Add a hidden continuation input so the resumed run has a concrete
          # model-visible delta and can make progress.
          replace_once(
              "server/src/cursor/request/runtime.rs",
              "use super::{context, images};\n\npub(crate) async fn compile_injection(\n",
              "use super::{context, images};\n\n"
              "const RESUME_PROMPT: &str = \"<resume>\\nContinue the unfinished task from the current conversation state. Use the latest workspace context, make concrete progress toward the user's request, and do not repeat work that is already complete.\\n</resume>\";\n\n"
              "pub(crate) async fn compile_injection(\n",
          )
          replace_once(
              "server/src/cursor/request/runtime.rs",
              "fn should_project_request_context(\n",
              "pub(super) fn compile_resume_messages(\n"
              "    request_id: &str,\n"
              "    request_context: &pb::RequestContext,\n"
              "    history: &[CanonicalMessage],\n"
              "    has_pending_tool_round: bool,\n"
              ") -> Result<Vec<CanonicalMessage>> {\n"
              "    let event_id = format!(\"resume:{request_id}\");\n"
              "    let mut messages = compile_request_context(&event_id, request_context, history)?\n"
              "        .into_iter()\n"
              "        .collect::<Vec<_>>();\n"
              "    if !has_pending_tool_round {\n"
              "        messages.push(CanonicalMessage::text(\n"
              "            format!(\"resume-prompt:{request_id}\"),\n"
              "            Role::User,\n"
              "            Origin::Prompt,\n"
              "            RESUME_PROMPT,\n"
              "        ));\n"
              "    }\n"
              "    Ok(messages)\n"
              "}\n\n"
              "fn should_project_request_context(\n",
          )

          path = "server/src/cursor/request/prepare.rs"
          replace_once(
              path,
              "    let request_context = context::hydrate(request, context_sync).await?;\n"
              "    let ActionProjection {\n",
              "    let request_context = context::hydrate(request, context_sync).await?;\n"
              "    let explicit_resume = matches!(\n"
              "        request\n"
              "            .action\n"
              "            .as_ref()\n"
              "            .and_then(|action| action.action.as_ref()),\n"
              "        Some(pb::conversation_action::Action::ResumeAction(_))\n"
              "    );\n"
              "    let ActionProjection {\n",
          )
          replace_once(
              path,
              "        background_completion,\n"
              "    } = action(request)?;\n"
              "    let checkpoint_mode = if request.subagent_type_name.is_some() {\n",
              "        background_completion,\n"
              "    } = action(request)?;\n"
              "    let pending_tool_round = if !starts_turn && !compacting {\n"
              "        match request\n"
              "            .conversation_state\n"
              "            .as_ref()\n"
              "            .map(|state| state.pending_tool_calls.as_slice())\n"
              "            .unwrap_or_default()\n"
              "        {\n"
              "            [] => None,\n"
              "            [pending] => Some(projection::decode_pending(pending)?),\n"
              "            pending => {\n"
              "                return Err(Error::Protocol(format!(\n"
              "                    \"Cursor resume contains {} pending assistant messages\",\n"
              "                    pending.len()\n"
              "                )))\n"
              "            }\n"
              "        }\n"
              "    } else {\n"
              "        None\n"
              "    };\n"
              "    let checkpoint_mode = if request.subagent_type_name.is_some() {\n",
          )
          replace_once(
              path,
              "    let (base_revision_id, reused) = store\n"
              "        .match_revision_prefix(&conversation_id, base_revision_id, &initial_messages)\n",
              "    if explicit_resume {\n"
              "        initial_messages.extend(runtime::compile_resume_messages(\n"
              "            request_id,\n"
              "            &request_context,\n"
              "            base_messages.as_deref().unwrap_or_default(),\n"
              "            pending_tool_round.is_some(),\n"
              "        )?);\n"
              "    }\n"
              "    let (base_revision_id, reused) = store\n"
              "        .match_revision_prefix(&conversation_id, base_revision_id, &initial_messages)\n",
          )
          sub_once(
              path,
              r"    let action = if compacting \{\n"
              r"        RunAction::Compact\n"
              r"    \} else if starts_turn \{\n"
              r"        RunAction::Start\n"
              r"    \} else \{\n"
              r"        let pending_tool_round = match request\n"
              r".*?"
              r"        RunAction::Resume \{ pending_tool_round \}\n"
              r"    \};",
              "    let action = if compacting {\n"
              "        RunAction::Compact\n"
              "    } else if starts_turn {\n"
              "        RunAction::Start\n"
              "    } else {\n"
              "        RunAction::Resume { pending_tool_round }\n"
              "    };",
          )

          # Keep the upstream implementation note accurate.
          replace_once(
              "server/src/cursor/actor.rs",
              "                                    //    ExecutePlanAction. ResumeAction only works indirectly through\n"
              "                                    //    the absence of a new runtime event and still needs an explicit\n"
              "                                    //    implementation that consumes ResumeAction.request_context.\n",
              "                                    //    ExecutePlanAction. ResumeAction is consumed explicitly by\n"
              "                                    //    request::prepare, including ResumeAction.request_context and a\n"
              "                                    //    hidden continuation prompt when no pending tool result exists.\n",
          )

          Path("server/tests/resume_progress.rs").write_text(r'''#[path = "support/fake_provider.rs"]
          mod fake_provider;
          #[path = "support/fixtures.rs"]
          mod fixtures;

          use std::sync::Arc;

          use cursor_server::{
              cursor::{
                  connect,
                  prompting::{PromptAssets, PromptCompiler},
                  proto::agent::v1 as pb,
                  CursorCommand, CursorSessionHandle, CursorSessionRegistry,
              },
              model::{ContentPart, ProjectedContent, Role},
              provider::{FinishReason, ModelEvent},
          };
          use prost::Message;

          #[tokio::test]
          async fn resume_action_context_and_continuation_reach_the_next_model_call() {
              let (_directory, store) = fixtures::temp_store().await;
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("model-initial", "initial response"));
              provider.push(text_response("model-resumed", "continued response"));
              let assets = PromptAssets::load(
                  std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                      .join("prompt/cursor")
                      .as_path(),
              )
              .unwrap();
              let registry = CursorSessionRegistry::new(
                  store,
                  Arc::new(provider.clone()),
                  PromptCompiler::new(assets),
                  Default::default(),
              );

              let first = registry.get_or_create("initial-request").await.unwrap();
              let mut first_output = first.subscribe();
              first
                  .command(CursorCommand::Append {
                      seqno: 0,
                      message: Box::new(start_request()),
                  })
                  .await
                  .unwrap();
              let state = drive_to_end(&first, &mut first_output, 1).await;
              assert!(state.pending_tool_calls.is_empty());

              let resumed = registry.get_or_create("resume-request").await.unwrap();
              let mut resumed_output = resumed.subscribe();
              resumed
                  .command(CursorCommand::Append {
                      seqno: 0,
                      message: Box::new(resume_request(state)),
                  })
                  .await
                  .unwrap();
              let _ = drive_to_end(&resumed, &mut resumed_output, 1).await;

              let requests = provider.requests();
              assert_eq!(requests.len(), 2);
              let history = &requests[1].history;
              assert_eq!(
                  history
                      .iter()
                      .filter(|message| message.message_id.starts_with("request-context:"))
                      .count(),
                  2,
                  "the changed ResumeAction context must be appended to history"
              );
              let texts = history
                  .iter()
                  .filter_map(projected_text)
                  .collect::<Vec<_>>();
              assert!(texts.iter().any(|text| text.contains("Shell: pwsh")));
              let last = history.last().expect("resume history must not be empty");
              assert_eq!(last.role, Role::User);
              assert_eq!(last.message_id, "resume-prompt:resume-request");
              assert!(projected_text(last).as_deref().is_some_and(|text| {
                  text.contains("<resume>") && text.contains("make concrete progress")
              }));
          }

          fn text_response(model_call_id: &str, text: &str) -> Vec<ModelEvent> {
              vec![
                  ModelEvent::Start {
                      model_call_id: model_call_id.into(),
                  },
                  ModelEvent::TextStart,
                  ModelEvent::TextDelta(text.into()),
                  ModelEvent::TextEnd,
                  ModelEvent::Done(FinishReason::Stop),
              ]
          }

          fn start_request() -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::RunRequest(
                      pb::AgentRunRequest {
                          action: Some(pb::ConversationAction {
                              action: Some(pb::conversation_action::Action::UserMessageAction(
                                  pb::UserMessageAction {
                                      user_message: Some(pb::UserMessage {
                                          text: "perform the task".into(),
                                          message_id: "user-1".into(),
                                          mode: pb::AgentMode::Agent as i32,
                                          ..Default::default()
                                      }),
                                      request_context: Some(request_context("bash")),
                                      ..Default::default()
                                  },
                              )),
                              ..Default::default()
                          }),
                          conversation_id: Some("resume-progress-conversation".into()),
                          run_id: Some("initial-wire-run".into()),
                          requested_model: Some(pb::RequestedModel {
                              model_id: "test-model".into(),
                              ..Default::default()
                          }),
                          ..Default::default()
                      },
                  )),
              }
          }

          fn resume_request(state: pb::ConversationStateStructure) -> pb::AgentClientMessage {
              pb::AgentClientMessage {
                  message: Some(pb::agent_client_message::Message::RunRequest(
                      pb::AgentRunRequest {
                          action: Some(pb::ConversationAction {
                              action: Some(pb::conversation_action::Action::ResumeAction(
                                  pb::ResumeAction {
                                      request_context: Some(request_context("pwsh")),
                                      ..Default::default()
                                  },
                              )),
                              ..Default::default()
                          }),
                          conversation_state: Some(state),
                          conversation_id: Some("resume-progress-conversation".into()),
                          run_id: Some("resume-wire-run".into()),
                          requested_model: Some(pb::RequestedModel {
                              model_id: "test-model".into(),
                              ..Default::default()
                          }),
                          ..Default::default()
                      },
                  )),
              }
          }

          fn request_context(shell: &str) -> pb::RequestContext {
              pb::RequestContext {
                  env: Some(pb::RequestContextEnv {
                      os_version: "windows".into(),
                      workspace_paths: vec!["C:/workspace".into()],
                      shell: shell.into(),
                      terminals_folder: "C:/terminals".into(),
                      agent_transcripts_folder: "C:/transcripts".into(),
                      ..Default::default()
                  }),
                  ..Default::default()
              }
          }

          fn projected_text(message: &cursor_server::model::ProjectedMessage) -> Option<String> {
              let ProjectedContent::Parts(parts) = &message.content else {
                  return None;
              };
              Some(
                  parts
                      .iter()
                      .filter_map(|part| match part {
                          ContentPart::Text { text } => Some(text.as_str()),
                          _ => None,
                      })
                      .collect::<Vec<_>>()
                      .join("\n"),
              )
          }

          async fn drive_to_end(
              handle: &CursorSessionHandle,
              output: &mut tokio::sync::mpsc::UnboundedReceiver<bytes::Bytes>,
              mut seqno: i64,
          ) -> pb::ConversationStateStructure {
              let mut latest = None;
              loop {
                  let frame = tokio::time::timeout(
                      std::time::Duration::from_secs(10),
                      output.recv(),
                  )
                  .await
                  .unwrap()
                  .unwrap();
                  let (flags, payload) = connect::decode_frames(&frame).unwrap().pop().unwrap();
                  if flags & connect::END_STREAM_FLAG != 0 {
                      break;
                  }
                  let server = pb::AgentServerMessage::decode(payload).unwrap();
                  match server.message {
                      Some(pb::agent_server_message::Message::KvServerMessage(kv)) => {
                          assert!(matches!(
                              kv.message,
                              Some(pb::kv_server_message::Message::SetBlobArgs(_))
                          ));
                          handle
                              .command(CursorCommand::Append {
                                  seqno,
                                  message: Box::new(pb::AgentClientMessage {
                                      message: Some(
                                          pb::agent_client_message::Message::KvClientMessage(
                                              pb::KvClientMessage {
                                                  id: kv.id,
                                                  message: Some(
                                                      pb::kv_client_message::Message::SetBlobResult(
                                                          pb::SetBlobResult { error: None },
                                                      ),
                                                  ),
                                              },
                                          ),
                                      ),
                                  }),
                              })
                              .await
                              .unwrap();
                          seqno += 1;
                      }
                      Some(
                          pb::agent_server_message::Message::ConversationCheckpointUpdate(state),
                      ) => latest = Some(state),
                      _ => {}
                  }
              }
              latest.expect("run must publish a checkpoint")
          }
          ''')

      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run focused ResumeAction regression test
        run: cargo test -p cursor-server --test resume_progress -- --nocapture
      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit tested fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-resume-action-progress-fix.yml
          rm -f .github/workflows/apply-resume-action-progress-fix-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make ResumeAction advance the agent turn"
          git push origin HEAD:fix/resume-action-progress
