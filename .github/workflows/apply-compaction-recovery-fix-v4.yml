name: Verify compaction recovery and threshold behavior

on:
  push:
    branches:
      - fix/compaction-recovery-threshold

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply source patch and corrected regression
        shell: python
        run: |
          from pathlib import Path
          import re

          # Execute the source patch assembled by v3 in this workspace.
          workflow = Path(".github/workflows/apply-compaction-recovery-fix-v3.yml").read_text()
          marker = "      - name: Complete source patch\n        shell: python\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n      - name: Format", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, "v3-compaction-patch", "exec"), {})

          test_path = Path("server/tests/compaction_recovery.rs")
          test = test_path.read_text()

          # Keep the synthetic usage anchor unquestionably valid. The 132.1k
          # provider input is above the new output-aware limit (129,904) but
          # below the old fixed-10k limit (140,000), so this E2E test proves
          # the threshold behavior changed for the intended reason.
          test, count = re.subn(
              r"(?m)^(\s*)prior_message_count,\n\s*first_request\.prompt\.tools\.len\(\),$",
              lambda match: f"{match.group(1)}0,\n{match.group(1)}first_request.prompt.tools.len(),",
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"threshold anchor call regex count: {count}")

          test, count = re.subn(
              r"(?ms)^\s*let prior_message_count = store\n\s*\.load_current_messages\(&ConversationId::new\(\n\s*\"compaction-recovery-conversation\",\n\s*\)\)\n\s*\.await\n\s*\.unwrap\(\)\n\s*\.len\(\);\n",
              "",
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"prior message count regex count: {count}")

          test = test.replace(
              "ContentPart, ConversationId, ModelConfigInput, ModelType, NewLlmCall,",
              "ContentPart, ModelConfigInput, ModelType, NewLlmCall,",
              1,
          )
          test = test.replace(
              "ProjectedContent, ProjectedMessage, ProviderType, Role, Usage,",
              "ProjectedContent, ProjectedMessage, Role, Usage,",
              1,
          )
          test_path.write_text(test)

          # Enforce the final threshold helper independently of the temporary
          # patch scripts. This removes the old local estimator functions and
          # guarantees RunEngine and CheckpointBuilder use the same estimator.
          engine_path = Path("server/src/run/engine.rs")
          engine = engine_path.read_text()
          helper_start = engine.find("fn auto_compaction_allowed(")
          if helper_start == -1:
              helper_start = engine.index("fn should_auto_compact(")
          helper_end = engine.index("fn fallback_summary(", helper_start)
          helpers = '''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              *action == RunAction::Start && last_auto_compaction_revision != Some(revision)
          }

          fn compaction_input_limit(prepared: &PreparedRun) -> Option<u64> {
              let context_window = prepared.model.context_window_tokens?;
              let reserve = prepared
                  .model
                  .max_output_tokens
                  .unwrap_or_default()
                  .saturating_add(COMPACTION_OUTPUT_SAFETY_TOKENS)
                  .max(COMPACTION_MIN_RESERVE_TOKENS);
              Some(context_window.saturating_sub(reserve))
          }

          fn should_auto_compact(
              prepared: &PreparedRun,
              messages: &[CanonicalMessage],
              anchor: Option<ContextUsageAnchor>,
          ) -> bool {
              if prepared.action != RunAction::Start
                  || messages.len() <= prepared.initial_messages.len()
              {
                  return false;
              }
              let Some(input_limit) = compaction_input_limit(prepared) else {
                  return false;
              };
              let estimated_input = anchor
                  .filter(|anchor| {
                      anchor.message_count <= messages.len()
                          && anchor.tool_count == prepared.prompt.tools.len()
                  })
                  .map(|anchor| {
                      anchor.input_tokens.saturating_add(
                          crate::model::estimate_message_tokens(
                              &messages[anchor.message_count..],
                          ),
                      )
                  })
                  .unwrap_or_else(|| {
                      crate::model::estimate_context_tokens(&prepared.prompt, messages)
                  });
              estimated_input >= input_limit
          }

          '''.replace("          ", "", 1)
          engine = engine[:helper_start] + helpers + engine[helper_end:]
          engine_path.write_text(engine)

          # Structural assertions before spending minutes compiling.
          engine = engine_path.read_text()
          model_mod = Path("server/src/model/mod.rs").read_text()
          token_estimator = Path("server/src/model/token_estimate.rs").read_text()
          summary = Path("server/src/cursor/checkpoint/summary.rs").read_text()
          session = Path("server/src/cursor/session.rs").read_text()
          configuration = Path("server/src/model/configuration.rs").read_text()
          required = {
              "shared engine message estimator": "crate::model::estimate_message_tokens" in engine,
              "shared engine context estimator": "crate::model::estimate_context_tokens" in engine,
              "inclusive threshold": "estimated_input >= input_limit" in engine,
              "revision re-arm": "last_auto_compaction_revision = Some(revision)" in engine,
              "shared estimator module": "mod token_estimate;" in model_mod and "estimate_message_tokens" in token_estimator,
              "compacted token reset": "self.record_context_tokens(Some(estimate_context_tokens(" in summary,
              "checkpoint published before continuation": "self.checkpoint.publish(&self.handle, &checkpoint).await" in session,
              "saved output budget propagated": "model.max_output_tokens = self.max_output_tokens();" in configuration,
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit("missing source invariants: " + ", ".join(missing))

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run compaction recovery regression
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture

      - name: Run existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture

      - name: Run resume regression
        run: cargo test -p cursor-server --test resume_progress -- --nocapture

      - name: Run removed-tool regression
        run: cargo test -p cursor-server --test removed_tool_compat -- --nocapture

      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit tested fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/apply-compaction-recovery-fix.yml
          rm .github/workflows/apply-compaction-recovery-fix-v2.yml
          rm .github/workflows/apply-compaction-recovery-fix-v3.yml
          rm .github/workflows/apply-compaction-recovery-fix-v4.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make compaction durable and threshold-aware"
          git push
