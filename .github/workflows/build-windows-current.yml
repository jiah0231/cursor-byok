name: Build current Windows beta

on:
  push:
    branches:
      - build/windows-0.1.5-beta.1-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run ResumeAction regression
        run: cargo test -p cursor-server --test resume_progress

      - name: Run removed-tool compatibility regression
        run: cargo test -p cursor-server --test removed_tool_compat

      - name: Build NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-windows/
          Copy-Item target/release/cursor-byok-desktop.exe dist-windows/cursor-byok-0.1.5-beta.1-windows-x64-portable.exe
          Get-ChildItem dist-windows | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-0.1.5-beta.1-windows-x64
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 7
