name: Repair and verify compaction recovery fix

on:
  push:
    branches:
      - fix/compaction-recovery-threshold

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Apply fixes robustly
        shell: python
        run: |
          from pathlib import Path
          import re

          legacy_path = Path(".github/workflows/apply-compaction-recovery-fix.yml")
          legacy = legacy_path.read_text()
          start = legacy.index("        run: |\n") + len("        run: |\n")
          end = legacy.index("\n      - name: Format", start)
          block = legacy[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )

          try:
              exec(compile(script, "legacy-compaction-patch", "exec"), {})
          except SystemExit as error:
              if str(error) != "engine auto-compaction gate did not match exactly":
                  raise

          engine_path = Path("server/src/run/engine.rs")
          engine = engine_path.read_text()

          gate_pattern = re.compile(
              r"            let context_anchor = if !auto_compacted && prepared\.action == RunAction::Start \{\n"
              r".*?"
              r"            if !auto_compacted && should_auto_compact\(prepared, &messages, context_anchor\) \{\n"
              r"                auto_compacted = true;\n",
              re.S,
          )
          gate_replacement = '''            let can_auto_compact = auto_compaction_allowed(
              &prepared.action,
              revision,
              last_auto_compaction_revision,
          );
          let context_anchor = if can_auto_compact {
              match self
                  .store
                  .latest_llm_call_usage_anchor(
                      &prepared.conversation_id,
                      &prepared.model.model_id,
                  )
                  .await
              {
                  Ok(anchor) => anchor.and_then(ContextUsageAnchor::from_llm_call),
                  Err(error) => return (RunOutcome::Failed(error.into()), usage),
              }
          } else {
              None
          };
          if can_auto_compact && should_auto_compact(prepared, &messages, context_anchor) {
          '''.replace("          ", "", 1)
          engine, count = gate_pattern.subn(gate_replacement, engine, count=1)
          if count != 1:
              raise SystemExit(f"auto-compaction gate patch count: {count}")

          success_pattern = re.compile(
              r"                    Ok\(\(next_revision, compaction_usage\)\) => \{\n"
              r"                        revision = next_revision;\n",
          )
          engine, count = success_pattern.subn(
              "                    Ok((next_revision, compaction_usage)) => {\n"
              "                        revision = next_revision;\n"
              "                        last_auto_compaction_revision = Some(revision);\n",
              engine,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"compaction success patch count: {count}")

          start = engine.index("fn should_auto_compact(")
          end = engine.index("fn fallback_summary(", start)
          engine = engine[:start] + '''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              *action == RunAction::Start && last_auto_compaction_revision != Some(revision)
          }

          fn compaction_input_limit(prepared: &PreparedRun) -> Option<u64> {
              let context_window = prepared.model.context_window_tokens?;
              let reserve = prepared
                  .model
                  .max_output_tokens
                  .unwrap_or_default()
                  .saturating_add(COMPACTION_OUTPUT_SAFETY_TOKENS)
                  .max(COMPACTION_MIN_RESERVE_TOKENS);
              Some(context_window.saturating_sub(reserve))
          }

          fn should_auto_compact(
              prepared: &PreparedRun,
              messages: &[CanonicalMessage],
              anchor: Option<ContextUsageAnchor>,
          ) -> bool {
              if prepared.action != RunAction::Start
                  || messages.len() <= prepared.initial_messages.len()
              {
                  return false;
              }
              let Some(input_limit) = compaction_input_limit(prepared) else {
                  return false;
              };
              let estimated_input = anchor
                  .filter(|anchor| {
                      anchor.message_count <= messages.len()
                          && anchor.tool_count == prepared.prompt.tools.len()
                  })
                  .map(|anchor| {
                      anchor.input_tokens.saturating_add(
                          crate::model::estimate_message_tokens(
                              &messages[anchor.message_count..],
                          ),
                      )
                  })
                  .unwrap_or_else(|| {
                      crate::model::estimate_context_tokens(&prepared.prompt, messages)
                  });
              estimated_input >= input_limit
          }

          '''.replace("          ", "", 1) + engine[end:]

          old_import = '''    use super::{
              auto_compaction_partition, estimate_context_tokens, hydrate_tool_images,
              should_auto_compact, ContextUsageAnchor,
          };
          '''.replace("          ", "", 1)
          new_import = '''    use super::{
              auto_compaction_allowed, auto_compaction_partition, compaction_input_limit,
              hydrate_tool_images, should_auto_compact, ContextUsageAnchor,
          };
          '''.replace("          ", "", 1)
          if engine.count(old_import) != 1:
              raise SystemExit("engine test import block did not match")
          engine = engine.replace(old_import, new_import, 1)
          old_model_import = "            CanonicalMessage, ContentPart, ConversationId, ModelSpec, Origin, PreparedRun,\n"
          new_model_import = (
              "            estimate_context_tokens, CanonicalMessage, ContentPart, ConversationId,\n"
              "            ModelSpec, Origin, PreparedRun,\n"
          )
          if engine.count(old_model_import) != 1:
              raise SystemExit("engine model test import did not match")
          engine = engine.replace(old_model_import, new_model_import, 1)

          tests_match = re.search(
              r"tests = r'''(.*?)'''\.replace\(\"          \", \"\", 1\)",
              script,
              re.S,
          )
          if not tests_match:
              raise SystemExit("could not extract threshold unit tests")
          tests = tests_match.group(1).replace("          ", "", 1)
          marker = "    #[test]\n    fn auto_compaction_preserves_only_the_latest_request_context() {\n"
          if engine.count(marker) != 1:
              raise SystemExit("engine unit test marker did not match")
          engine = engine.replace(marker, tests + marker, 1)
          engine_path.write_text(engine)

          test_prefix = 'Path("server/tests/compaction_recovery.rs").write_text(r\'\'\''
          test_start = script.index(test_prefix) + len(test_prefix)
          test_end = script.index("'''\.replace", test_start) if "'''\.replace" in script[test_start:] else -1
          if test_end == -1:
              test_end = script.index("'''.replace(\"          \", \"\", 1))", test_start)
          recovery_test = script[test_start:test_end].replace("          ", "", 1)
          Path("server/tests/compaction_recovery.rs").write_text(recovery_test)

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run compaction recovery regression
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture

      - name: Run existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture

      - name: Run resume regression
        run: cargo test -p cursor-server --test resume_progress -- --nocapture

      - name: Run removed-tool regression
        run: cargo test -p cursor-server --test removed_tool_compat -- --nocapture

      - name: Test cursor-server
        run: cargo test -p cursor-server --all-targets

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit tested fix and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/apply-compaction-recovery-fix.yml
          rm .github/workflows/apply-compaction-recovery-fix-v2.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make compaction durable and threshold-aware"
          git push
