name: Verify runtime compaction patch v8
on:
  push:
    branches: [fix/compaction-during-resume-timeout]
    paths: [.github/workflows/patch-compaction-runtime-v8.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Reset product files
        run: git checkout origin/fix/compaction-recovery-threshold -- server/src/run/engine.rs server/tests/compaction_recovery.rs
      - name: Apply known compiling Resume timeout patch
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          wf = yaml.safe_load(Path('.github/workflows/patch-compaction-runtime.yml').read_text())
          steps = wf['jobs']['patch-test-commit']['steps']
          exec(compile(next(x['run'] for x in steps if x.get('name') == 'Patch runtime compaction'), '<patch>', 'exec'), {})
          exec(compile(next(x['run'] for x in steps if x.get('name') == 'Add Resume compaction regression test'), '<test>', 'exec'), {})
          p = Path('server/src/run/engine.rs')
          s = p.read_text()
          marker = '(false, true, None) => {'
          before, after = s.split(marker, 1)
          after = after.replace('(fallback_summary(&compactable), None)', '(fallback_summary(&compactable), match timed_out_cycle { Some(Ok(cycle)) => cycle.usage, Some(Err(failure)) => failure.usage, None => None })', 1)
          s = before + '(false, true, timed_out_cycle) => {' + after
          # Bound latency more tightly and reduce summary generation length.
          s = s.replace('Duration::from_secs(45)', 'Duration::from_secs(30)', 1)
          s = s.replace('const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;', 'const COMPACTION_OUTPUT_TOKENS: u64 = 2_048;', 1)
          # A Resume may inherit a stale pre-compaction usage anchor. Ignore cross-run usage
          # until this Resume completes one normal provider call; local estimation still
          # triggers immediately when the recovered state itself is actually oversized.
          s = s.replace('        let mut last_auto_compaction_revision = None;\n', '        let mut last_auto_compaction_revision = None;\n        let mut provider_completed_this_run = false;\n', 1)
          start = s.index('            let context_anchor = if can_auto_compact {')
          end = s.index('            if can_auto_compact && should_auto_compact', start)
          block = '''            let may_use_usage_anchor =
                  prepared.action == RunAction::Start || provider_completed_this_run;
              let context_anchor = if can_auto_compact && may_use_usage_anchor {
                  match self
                      .store
                      .latest_llm_call_usage_anchor(
                          &prepared.conversation_id,
                          &prepared.model.model_id,
                      )
                      .await
                  {
                      Ok(anchor) => anchor.and_then(ContextUsageAnchor::from_llm_call),
                      Err(error) => return (RunOutcome::Failed(error.into()), usage),
                  }
              } else {
                  None
              };
'''
          s = s[:start] + block + s[end:]
          # Mark only a successful ordinary model cycle as a fresh anchor source.
          ac = s.index('    async fn auto_compact(')
          pos = s.rfind('            if let Some(cycle_usage) = cycle.usage {', 0, ac)
          assert pos != -1
          s = s[:pos] + '            provider_completed_this_run = true;\n' + s[pos:]
          p.write_text(s)

          # Replace the synthetic-anchor Resume test with a real oversized recovered state.
          p = Path('server/tests/compaction_recovery.rs')
          t = p.read_text()
          begin = t.index('#[tokio::test]\nasync fn resume_action_auto_compacts_before_the_next_model_call()')
          end = t.index('async fn record_threshold_anchor(', begin)
          test = r'''#[tokio::test]
          async fn resume_action_auto_compacts_large_recovered_state_without_new_user_message() {
              let (_directory, store) = fixtures::temp_store().await;
              let model = store.create_model(&ModelConfigInput {
                  sort_order: 0, display_name: "Resume Threshold".into(), model_type: ModelType::OpenAi,
                  base_url: "https://example.com/v1/chat/completions".into(), use_full_url: true,
                  api_key: "test-key".into(), tooltip_data: "Resume Threshold".into(), model_id: "resume-threshold".into(),
                  reasoning_effort: None, openai_endpoint: OPENAI_CHAT_ENDPOINT.into(), openai_extra_params_enabled: false,
                  openai_extra_params: serde_json::json!({}), custom_headers_enabled: false, custom_headers: serde_json::json!({}),
                  anthropic_extra_params_enabled: false, anthropic_extra_params: serde_json::json!({}),
                  context_window_tokens: Some(30_000), max_completion_tokens: Some(4_000), anthropic_max_tokens: None,
                  anthropic_thinking_effort: None, thinking_budget_tokens: None,
              }).await.unwrap();
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("x".repeat(100_000), 1_000, 25_000));
              provider.push(text_response("resume summary marker", 26_000, 100));
              provider.push(text_response("continued after resume compaction", 2_000, 20));
              let assets = PromptAssets::load(std::path::Path::new(env!("CARGO_MANIFEST_DIR")).join("prompt/cursor").as_path()).unwrap();
              let registry = CursorSessionRegistry::new(store.clone(), Arc::new(provider.clone()), PromptCompiler::new(assets), Default::default());
              let first = run(&registry, "resume-large-first", user_request("resume-large-conversation", "resume-user", "start long work", &model.model_hash, None)).await;
              assert!(first.end_error.is_none());
              let state = first.checkpoints.last().unwrap().clone();
              let resumed = run(&registry, "resume-large-second", resume_request("resume-large-conversation", &model.model_hash, state)).await;
              assert!(resumed.end_error.is_none());
              assert_eq!(resumed.summary_started, 1);
              assert_eq!(resumed.summary_completed, 1);
              let requests = provider.requests();
              assert_eq!(requests.len(), 3);
              assert!(requests[1].prompt.tools.is_empty());
              assert!(history_text(&requests[2].history).contains("resume summary marker"));
          }

          '''
          t = t[:begin] + test + t[end:]
          p.write_text(t)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compaction recovery and Resume E2E
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture --test-threads=1
      - name: Engine unit tests
        run: cargo test -p cursor-server run::engine::tests -- --nocapture
      - name: Existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture
      - name: Resume regression
        run: cargo test -p cursor-server --test resume_progress -- --nocapture
      - name: Full server suite
        run: cargo test -p cursor-server --all-targets
      - name: Diff check
        run: git diff --check
      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/run/engine.rs server/tests/compaction_recovery.rs
          git commit -m "fix: compact throughout resumed work and bound summary latency"
          git push origin HEAD:fix/compaction-during-resume-timeout
