name: Verify upstream sync

on:
  push:
    branches:
      - sync/upstream-20260831

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Port ResumeAction recovery
        run: python .github/scripts/port-resume-action.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run ResumeAction regression
        run: cargo test -p cursor-server --test resume_progress -- --nocapture

      - name: Test all cursor-server targets
        run: cargo test -p cursor-server --all-targets

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check desktop frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Commit tested sync
        shell: bash
        run: |
          rm .github/workflows/sync-upstream-verify.yml
          rm .github/scripts/port-resume-action.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: upstream v0.1.5 and port ResumeAction recovery"
          git push
