name: Prepare clean upstream compaction PR branch

on:
  push:
    branches:
      - fix/compaction-during-resume-timeout
    paths:
      - .github/workflows/prepare-compaction-upstream-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build clean branch on latest upstream main
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/leookun/cursor-byok.git
          git fetch upstream main
          git fetch origin main fix/compaction-during-resume-timeout

          # Apply every intended file except engine.rs with a real three-way patch.
          # engine.rs changed upstream after this fix was developed, so it is
          # integrated below while preserving upstream projected-message accounting.
          git diff --binary origin/main..origin/fix/compaction-during-resume-timeout -- \
            server/src/cursor/checkpoint/summary.rs \
            server/src/cursor/session.rs \
            server/src/model/configuration.rs \
            server/src/model/mod.rs \
            server/src/model/token_estimate.rs \
            server/tests/compaction_recovery.rs \
            server/tests/compaction_timeout.rs \
            > /tmp/compaction-non-engine.patch

          git checkout -B fix/compaction-recovery-upstream upstream/main
          git apply --3way --index /tmp/compaction-non-engine.patch

          python - <<'PY'
          from pathlib import Path

          path = Path("server/src/run/engine.rs")
          s = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              s = s.replace(old, new, 1)

          replace_once(
              "use std::collections::HashSet;\nuse std::sync::Arc;",
              "use std::collections::HashSet;\nuse std::{sync::Arc, time::Duration};",
              "imports",
          )
          replace_once(
              "const COMPACTION_RESERVE_TOKENS: u64 = 10_000;\n"
              "const COMPACTION_OUTPUT_TOKENS: u64 = 4_096;",
              "const COMPACTION_MIN_RESERVE_TOKENS: u64 = 10_000;\n"
              "const COMPACTION_OUTPUT_TOKENS: u64 = 2_048;\n"
              "const COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;\n"
              "const AUTO_COMPACTION_TIMEOUT: Duration = Duration::from_secs(30);",
              "compaction constants",
          )

          start = s.index("        let mut auto_compacted = prepared.action == RunAction::Compact;")
          end = s.index("            let provider_call_index =", start)
          s = s[:start] + '''        let mut last_auto_compaction_revision = None;
          let mut provider_completed_this_run = false;
          'model: loop {
              if cancellation.is_cancelled() {
                  return (RunOutcome::Cancelled, usage);
              }
              let messages = match self.store.load_revision_messages(revision).await {
                  Ok(messages) => messages,
                  Err(error) => return (RunOutcome::Failed(error.into()), usage),
              };
              let can_auto_compact =
                  auto_compaction_allowed(&prepared.action, revision, last_auto_compaction_revision);
              // A Resume can start from a freshly compacted checkpoint while the latest
              // completed provider usage still describes the pre-compaction history.
              // Estimate the recovered state directly until this run has a fresh call.
              let may_use_usage_anchor =
                  prepared.action == RunAction::Start || provider_completed_this_run;
              let context_anchor = if can_auto_compact && may_use_usage_anchor {
                  match self
                      .store
                      .latest_llm_call_usage_anchor(
                          &prepared.conversation_id,
                          &prepared.model.model_id,
                      )
                      .await
                  {
                      Ok(anchor) => anchor.and_then(ContextUsageAnchor::from_llm_call),
                      Err(error) => return (RunOutcome::Failed(error.into()), usage),
                  }
              } else {
                  None
              };
              // Keep the upstream projected-message accounting here: provider usage
              // anchors count projected messages, not canonical tool-round fragments.
              let history = match crate::model::project_messages(&messages) {
                  Ok(history) => history,
                  Err(error) => return (RunOutcome::Failed(error.into()), usage),
              };
              if can_auto_compact
                  && should_auto_compact(prepared, &messages, &history, context_anchor)
              {
                  match self
                      .auto_compact(prepared, revision, &messages, client, cancellation)
                      .await
                  {
                      Ok((next_revision, compaction_usage)) => {
                          revision = next_revision;
                          last_auto_compaction_revision = Some(revision);
                          if let Some(compaction_usage) = compaction_usage {
                              accumulate_usage(&mut usage, compaction_usage);
                          }
                          continue 'model;
                      }
                      Err(outcome) => return (outcome, usage),
                  }
              }
          ''' + s[end:]

          replace_once(
              "            };\n            if let Some(cycle_usage) = cycle.usage {",
              "            };\n            provider_completed_this_run = true;\n"
              "            if let Some(cycle_usage) = cycle.usage {",
              "fresh usage anchor activation",
          )

          # Bound the automatic summary model call. A provider that never yields
          # must not leave the Agent permanently stuck in Summarizing chat context.
          start = s.index(
              "        let mut pending_insertions = Vec::new();\n"
              "        let mut interrupted_message = None;\n"
              "        let cycle = {"
          )
          end = s.index('        let event_id = format!("summary:auto:{}", prepared.run_id);', start)
          timeout_block = '''        let mut pending_insertions = Vec::new();
          let mut interrupted_message = None;
          let mut compaction_timed_out = false;
          let cycle = {
              let cycle = consume_model_cycle(
                  self.provider.stream(invocation, cycle_cancellation.clone()),
                  &silent_events,
                  &cycle_cancellation,
              );
              tokio::pin!(cycle);
              let timeout = tokio::time::sleep(AUTO_COMPACTION_TIMEOUT);
              tokio::pin!(timeout);
              loop {
                  tokio::select! {
                      biased;
                      command = client.commands.recv() => match command {
                          Some(ClientCommand::InsertMessages(insertion)) => {
                              pending_insertions.push(insertion);
                          }
                          Some(ClientCommand::InterruptWithMessage(message)) => {
                              cycle_cancellation.cancel();
                              interrupted_message = Some(message);
                              break Some(cycle.await);
                          }
                          Some(ClientCommand::RuntimeEvent(event)) => {
                              cycle_cancellation.cancel();
                              interrupted_message = Some(event.into_message());
                              break Some(cycle.await);
                          }
                          Some(ClientCommand::Cancel) => {
                              cycle_cancellation.cancel();
                              return Err(RunOutcome::Cancelled);
                          }
                          Some(ClientCommand::ClientClosed { error }) => {
                              cycle_cancellation.cancel();
                              return Err(RunOutcome::Failed(RunFailure::Client(error)));
                          }
                          Some(ClientCommand::ToolResult(_)) => {
                              cycle_cancellation.cancel();
                              return Err(RunOutcome::Failed(RunFailure::Protocol(
                                  "received a tool result while automatic compaction was running".into(),
                              )));
                          }
                          None => {
                              cycle_cancellation.cancel();
                              return Err(client_failure());
                          }
                      },
                      result = &mut cycle => break Some(result),
                      _ = &mut timeout => {
                          compaction_timed_out = true;
                          cycle_cancellation.cancel();
                          break None;
                      },
                  }
              }
          };
          drop(silent_events);
          let _ = drain.await;
          let (summary, compaction_usage) = match (
              interrupted_message.is_some(),
              compaction_timed_out,
              cycle,
          ) {
              (false, true, timed_out_cycle) => {
                  tracing::warn!(
                      timeout_seconds = AUTO_COMPACTION_TIMEOUT.as_secs(),
                      "automatic compaction timed out; using fallback"
                  );
                  (
                      fallback_summary(&compactable),
                      match timed_out_cycle {
                          Some(Ok(cycle)) => cycle.usage,
                          Some(Err(failure)) => failure.usage,
                          None => None,
                      },
                  )
              }
              (true, _, Some(Ok(cycle))) => (fallback_summary(&compactable), cycle.usage),
              (true, _, Some(Err(failure))) => (fallback_summary(&compactable), failure.usage),
              (false, false, Some(Ok(cycle)))
                  if cycle.calls.is_empty() && !cycle.text.trim().is_empty() =>
              {
                  (cycle.text.trim().to_string(), cycle.usage)
              }
              (false, false, Some(Ok(cycle))) => {
                  tracing::warn!("automatic compaction returned no usable summary; using fallback");
                  (fallback_summary(&compactable), cycle.usage)
              }
              (false, false, Some(Err(failure))) => {
                  tracing::warn!(error = ?failure.failure, "automatic compaction model failed; using fallback");
                  (fallback_summary(&compactable), failure.usage)
              }
              (_, _, None) => {
                  tracing::warn!("automatic compaction ended without a model result; using fallback");
                  (fallback_summary(&compactable), None)
              }
          };
          '''
          s = s[:start] + timeout_block + s[end:]

          start = s.index("fn should_auto_compact(")
          end = s.index("fn fallback_summary(", start)
          helpers = '''fn auto_compaction_allowed(
              action: &RunAction,
              revision: crate::model::RevisionId,
              last_auto_compaction_revision: Option<crate::model::RevisionId>,
          ) -> bool {
              !matches!(action, RunAction::Compact) && last_auto_compaction_revision != Some(revision)
          }

          fn compaction_input_limit(prepared: &PreparedRun) -> Option<u64> {
              let context_window = prepared.model.context_window_tokens?;
              let reserve = prepared
                  .model
                  .max_output_tokens
                  .unwrap_or_default()
                  .saturating_add(COMPACTION_OUTPUT_SAFETY_TOKENS)
                  .max(COMPACTION_MIN_RESERVE_TOKENS);
              Some(context_window.saturating_sub(reserve))
          }

          fn should_auto_compact(
              prepared: &PreparedRun,
              messages: &[CanonicalMessage],
              projected_messages: &[crate::model::ProjectedMessage],
              anchor: Option<ContextUsageAnchor>,
          ) -> bool {
              if prepared.action == RunAction::Compact || messages.len() <= prepared.initial_messages.len() {
                  return false;
              }
              let Some(input_limit) = compaction_input_limit(prepared) else {
                  return false;
              };
              let estimated_input = anchor
                  .filter(|anchor| {
                      anchor.message_count <= projected_messages.len()
                          && anchor.tool_count == prepared.prompt.tools.len()
                  })
                  .map(|anchor| {
                      anchor.input_tokens.saturating_add(crate::model::estimate_message_tokens(
                          &projected_messages[anchor.message_count..],
                      ))
                  })
                  .unwrap_or_else(|| crate::model::estimate_context_tokens(&prepared.prompt, messages));
              estimated_input >= input_limit
          }

          '''
          s = s[:start] + helpers + s[end:]

          replace_once(
              "    use super::{\n"
              "        auto_compaction_partition, estimate_context_tokens, hydrate_tool_images,\n"
              "        should_auto_compact, ContextUsageAnchor,\n"
              "    };",
              "    use super::{\n"
              "        auto_compaction_allowed, auto_compaction_partition, compaction_input_limit,\n"
              "        hydrate_tool_images, should_auto_compact, ContextUsageAnchor,\n"
              "    };",
              "engine test imports",
          )
          replace_once(
              "            CanonicalMessage, ContentPart, ConversationId, MessageContent, ModelSpec, Origin,\n",
              "            estimate_context_tokens, CanonicalMessage, ContentPart, ConversationId,\n"
              "            MessageContent, ModelSpec, Origin,\n",
              "shared estimator test import",
          )

          marker = "    #[test]\n    fn auto_compaction_preserves_only_the_latest_request_context() {\n"
          if s.count(marker) != 1:
              raise SystemExit("unit-test insertion marker changed")
          extra_tests = r'''    #[test]
              fn configured_output_budget_is_reserved_for_the_next_model_call() {
                  let current = CanonicalMessage::text(
                      "runtime:current",
                      Role::User,
                      Origin::Runtime,
                      "current request",
                  );
                  let mut prepared = PreparedRun {
                      run_id: RunId::new("run"),
                      cursor_request_id: None,
                      conversation_id: ConversationId::new("conversation"),
                      kind: RunKind::Root,
                      model: ModelSpec {
                          context_window_tokens: Some(100_000),
                          ..ModelSpec::new("model")
                      },
                      prompt: PromptSpec {
                          instructions: "system".into(),
                          tools: Vec::new(),
                      },
                      initial_messages: vec![current],
                      action: RunAction::Start,
                      base_revision_id: RevisionId(1),
                  };

                  assert_eq!(compaction_input_limit(&prepared), Some(90_000));
                  prepared.model.max_output_tokens = Some(32_000);
                  assert_eq!(compaction_input_limit(&prepared), Some(63_904));
              }

              #[test]
              fn automatic_compaction_is_revision_scoped_and_allows_resume() {
                  assert!(auto_compaction_allowed(&RunAction::Start, RevisionId(2), None));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(2),
                      Some(RevisionId(2)),
                  ));
                  assert!(auto_compaction_allowed(
                      &RunAction::Start,
                      RevisionId(3),
                      Some(RevisionId(2)),
                  ));
                  assert!(auto_compaction_allowed(
                      &RunAction::Resume {
                          pending_tool_round: None,
                      },
                      RevisionId(3),
                      Some(RevisionId(2)),
                  ));
                  assert!(!auto_compaction_allowed(
                      &RunAction::Compact,
                      RevisionId(3),
                      None,
                  ));
              }

              #[test]
              fn automatic_compaction_threshold_is_inclusive() {
                  let old = CanonicalMessage::text("old", Role::User, Origin::User, "old history");
                  let current = CanonicalMessage::text(
                      "runtime:current",
                      Role::User,
                      Origin::Runtime,
                      "current request",
                  );
                  let messages = vec![old, current.clone()];
                  let prepared = PreparedRun {
                      run_id: RunId::new("run"),
                      cursor_request_id: None,
                      conversation_id: ConversationId::new("conversation"),
                      kind: RunKind::Root,
                      model: ModelSpec {
                          context_window_tokens: Some(100_000),
                          ..ModelSpec::new("model")
                      },
                      prompt: PromptSpec {
                          instructions: "system".into(),
                          tools: Vec::new(),
                      },
                      initial_messages: vec![current],
                      action: RunAction::Start,
                      base_revision_id: RevisionId(1),
                  };
                  let projected = crate::model::project_messages(&messages).unwrap();
                  let anchor = ContextUsageAnchor {
                      input_tokens: compaction_input_limit(&prepared).unwrap(),
                      message_count: projected.len(),
                      tool_count: 0,
                  };

                  assert!(should_auto_compact(
                      &prepared,
                      &messages,
                      &projected,
                      Some(anchor),
                  ));
              }

          '''
          extra_tests = extra_tests.replace("              ", "", 1)
          s = s.replace(marker, extra_tests + marker, 1)
          path.write_text(s)

          # The shared delta estimator must accept projected messages too, because
          # provider usage anchors count provider-projected history entries.
          estimator = Path("server/src/model/token_estimate.rs")
          e = estimator.read_text()
          old = "pub(crate) fn estimate_message_tokens(messages: &[CanonicalMessage]) -> u64 {"
          new = "pub(crate) fn estimate_message_tokens<T: Serialize>(messages: &[T]) -> u64 {"
          if e.count(old) != 1:
              raise SystemExit("shared message estimator signature changed")
          estimator.write_text(e.replace(old, new, 1))
          PY

          git add server/src/cursor/checkpoint/summary.rs \
                  server/src/cursor/session.rs \
                  server/src/model/configuration.rs \
                  server/src/model/mod.rs \
                  server/src/model/token_estimate.rs \
                  server/src/run/engine.rs \
                  server/tests/compaction_recovery.rs \
                  server/tests/compaction_timeout.rs
          git diff --cached --check
          git diff --cached --stat

      - name: Format and test rebased result
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          git add server/src/cursor/checkpoint/summary.rs \
                  server/src/cursor/session.rs \
                  server/src/model/configuration.rs \
                  server/src/model/mod.rs \
                  server/src/model/token_estimate.rs \
                  server/src/run/engine.rs \
                  server/tests/compaction_recovery.rs \
                  server/tests/compaction_timeout.rs
          cargo fmt --all -- --check
          cargo test -p cursor-server --test compaction_recovery -- --nocapture
          cargo test -p cursor-server --test compaction_timeout -- --nocapture
          cargo test -p cursor-server --test compaction -- --nocapture
          cargo test -p cursor-server --test resume_progress -- --nocapture
          cargo test -p cursor-server run::engine::tests -- --nocapture
          cargo test -p cursor-server --all-targets
          git diff --cached --check

      - name: Commit and push clean branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "jiah0231"
          git config user.email "2243725197@cug.edu.cn"
          git commit -m "fix: make automatic compaction durable and recoverable"
          git push --force-with-lease origin HEAD:fix/compaction-recovery-upstream
