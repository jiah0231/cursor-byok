name: Patch runtime compaction v2
on:
  push:
    branches: [fix/compaction-during-resume-timeout]
    paths: [.github/workflows/patch-compaction-runtime-v2.yml]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compaction-during-resume-timeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Patch source and tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/src/run/engine.rs')
          s = p.read_text()
          s = s.replace('use std::sync::Arc;', 'use std::{sync::Arc, time::Duration};', 1)
          s = s.replace('const COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;', 'const COMPACTION_OUTPUT_SAFETY_TOKENS: u64 = 4_096;\nconst AUTO_COMPACTION_TIMEOUT: Duration = Duration::from_secs(45);', 1)
          s = s.replace('*action == RunAction::Start && last_auto_compaction_revision != Some(revision)', '!matches!(action, RunAction::Compact) && last_auto_compaction_revision != Some(revision)', 1)
          s = s.replace('prepared.action != RunAction::Start || messages.len() <= prepared.initial_messages.len()', 'prepared.action == RunAction::Compact || messages.len() <= prepared.initial_messages.len()', 1)

          head, tail = s.split('    async fn auto_compact(', 1)
          tail = tail.replace('let mut interrupted_message = None;\n        let cycle = {', 'let mut interrupted_message = None;\n        let mut compaction_timed_out = false;\n        let cycle = {', 1)
          tail = tail.replace('tokio::pin!(cycle);\n            loop {', 'tokio::pin!(cycle);\n            let timeout = tokio::time::sleep(AUTO_COMPACTION_TIMEOUT);\n            tokio::pin!(timeout);\n            loop {', 1)
          tail = tail.replace('break cycle.await;', 'break Some(cycle.await);', 2)
          tail = tail.replace('result = &mut cycle => break result,', 'result = &mut cycle => break Some(result),\n                    _ = &mut timeout => {\n                        compaction_timed_out = true;\n                        cycle_cancellation.cancel();\n                        break None;\n                    },', 1)
          old = '''        let (summary, compaction_usage) = match (interrupted_message.is_some(), cycle) {
              (true, Ok(cycle)) => (fallback_summary(&compactable), cycle.usage),
              (true, Err(failure)) => (fallback_summary(&compactable), failure.usage),
              (false, Ok(cycle)) if cycle.calls.is_empty() && !cycle.text.trim().is_empty() => {
                  (cycle.text.trim().to_string(), cycle.usage)
              }
              (false, Ok(cycle)) => {
                  tracing::warn!("automatic compaction returned no usable summary; using fallback");
                  (fallback_summary(&compactable), cycle.usage)
              }
              (false, Err(failure)) => {
                  tracing::warn!(error = ?failure.failure, "automatic compaction model failed; using fallback");
                  (fallback_summary(&compactable), failure.usage)
              }
          };'''
          new = '''        let (summary, compaction_usage) = match (interrupted_message.is_some(), compaction_timed_out, cycle) {
              (false, true, None) => {
                  tracing::warn!(timeout_seconds = AUTO_COMPACTION_TIMEOUT.as_secs(), "automatic compaction timed out; using fallback");
                  (fallback_summary(&compactable), None)
              }
              (true, _, Some(Ok(cycle))) => (fallback_summary(&compactable), cycle.usage),
              (true, _, Some(Err(failure))) => (fallback_summary(&compactable), failure.usage),
              (false, false, Some(Ok(cycle))) if cycle.calls.is_empty() && !cycle.text.trim().is_empty() => {
                  (cycle.text.trim().to_string(), cycle.usage)
              }
              (false, false, Some(Ok(cycle))) => {
                  tracing::warn!("automatic compaction returned no usable summary; using fallback");
                  (fallback_summary(&compactable), cycle.usage)
              }
              (false, false, Some(Err(failure))) => {
                  tracing::warn!(error = ?failure.failure, "automatic compaction model failed; using fallback");
                  (fallback_summary(&compactable), failure.usage)
              }
              (_, _, None) => (fallback_summary(&compactable), None),
          };'''
          assert old in tail
          tail = tail.replace(old, new, 1)
          s = head + '    async fn auto_compact(' + tail

          # Unit-test Resume eligibility.
          needle = '''        assert!(!auto_compaction_allowed(
              &RunAction::Compact,
              RevisionId(3),
              None,
          ));'''
          repl = '''        assert!(auto_compaction_allowed(
              &RunAction::Resume { pending_tool_round: None },
              RevisionId(3),
              Some(RevisionId(2)),
          ));
          assert!(!auto_compaction_allowed(
              &RunAction::Compact,
              RevisionId(3),
              None,
          ));'''
          assert needle in s
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          # Add an end-to-end Resume threshold regression using the existing test helpers.
          p = Path('server/tests/compaction_recovery.rs')
          t = p.read_text()
          marker = 'async fn record_threshold_anchor('
          assert marker in t
          test = r'''#[tokio::test]
          async fn resume_action_auto_compacts_without_new_user_message() {
              let (_directory, store) = fixtures::temp_store().await;
              let model = store.create_model(&ModelConfigInput {
                  sort_order: 0, display_name: "Resume Threshold".into(), model_type: ModelType::OpenAi,
                  base_url: "https://example.com/v1/chat/completions".into(), use_full_url: true,
                  api_key: "test-key".into(), tooltip_data: "Resume Threshold".into(),
                  model_id: "resume-threshold".into(), reasoning_effort: None,
                  openai_endpoint: OPENAI_CHAT_ENDPOINT.into(), openai_extra_params_enabled: false,
                  openai_extra_params: serde_json::json!({}), custom_headers_enabled: false,
                  custom_headers: serde_json::json!({}), anthropic_extra_params_enabled: false,
                  anthropic_extra_params: serde_json::json!({}), context_window_tokens: Some(150_000),
                  max_completion_tokens: Some(16_000), anthropic_max_tokens: None,
                  anthropic_thinking_effort: None, thinking_budget_tokens: None,
              }).await.unwrap();
              let provider = fake_provider::FakeProvider::default();
              provider.push(text_response("initial answer", 132_000, 100));
              provider.push(text_response("resume summary marker", 132_100, 20));
              provider.push(text_response("continued answer", 2_000, 20));
              let assets = PromptAssets::load(std::path::Path::new(env!("CARGO_MANIFEST_DIR")).join("prompt/cursor").as_path()).unwrap();
              let registry = CursorSessionRegistry::new(store.clone(), Arc::new(provider.clone()), PromptCompiler::new(assets), Default::default());
              let first = run(&registry, "resume-first", user_request("resume-threshold-conversation", "resume-user", "long work", &model.model_hash, None)).await;
              assert!(first.end_error.is_none());
              let state = first.checkpoints.last().unwrap().clone();
              let call_id = "resume-threshold-anchor";
              let provider_type = model.provider_type();
              store.start_llm_call(&NewLlmCall {
                  call_id: call_id.into(), run_id: "anchor-run".into(), conversation_id: "resume-threshold-conversation".into(),
                  provider_call_index: 0, model_hash: model.model_hash.clone(), provider_type,
                  provider_url: model.base_url.clone(), request_type: provider_type, request_url: model.request_url().unwrap(),
                  model_id: model.model_id.clone(), display_name: model.display_name.clone(), reasoning_effort: None,
                  fast: false, message_count: 0, tool_count: provider.requests()[0].prompt.tools.len(), detailed: false,
              }).await.unwrap();
              store.record_llm_usage(call_id, Usage { input_tokens: Some(132_000), output_tokens: Some(100), total_tokens: Some(132_100), ..Default::default() }).await.unwrap();
              store.finish_llm_call(call_id, "completed", Some("stop"), 1, None, None).await.unwrap();
              let resumed = run(&registry, "resume-second", resume_request("resume-threshold-conversation", &model.model_hash, state)).await;
              assert!(resumed.end_error.is_none());
              assert_eq!(resumed.summary_started, 1);
              assert_eq!(resumed.summary_completed, 1);
              let requests = provider.requests();
              assert_eq!(requests.len(), 3);
              assert!(requests[1].prompt.tools.is_empty());
              assert!(history_text(&requests[2].history).contains("resume summary marker"));
          }

          '''
          t = t.replace(marker, test + marker, 1)
          p.write_text(t)
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Resume/compaction E2E
        run: cargo test -p cursor-server --test compaction_recovery -- --nocapture
      - name: Engine unit tests
        run: cargo test -p cursor-server run::engine::tests -- --nocapture
      - name: Existing compaction tests
        run: cargo test -p cursor-server --test compaction -- --nocapture
      - name: Full server suite
        run: cargo test -p cursor-server --all-targets
      - name: Diff check
        run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/run/engine.rs server/tests/compaction_recovery.rs
          git commit -m "fix: compact during resume and bound summary latency"
          git push origin HEAD:fix/compaction-during-resume-timeout
